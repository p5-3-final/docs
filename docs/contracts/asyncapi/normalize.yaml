asyncapi: 3.0.0
info:
  title: normalize events
  version: 1.0.0
  description: 불변 정규화 결과. 최소 한 번 전달이며 소비자는 eventId와 정규화 결과의 불변성을 검증한다. SPEC-007·SPEC-008.
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
channels:
  videoNormalized:
    address: video.normalized
    messages:
      videoNormalized:
        $ref: '#/components/messages/VideoNormalized'
operations:
  publishVideoNormalized:
    action: send
    summary: 정규화 READY 또는 REJECTED 결과 발행
    channel:
      $ref: '#/channels/videoNormalized'
    messages:
      - $ref: '#/channels/videoNormalized/messages/videoNormalized'
components:
  messages:
    VideoNormalized:
      name: video.normalized
      title: 정규화 결과
      headers:
        type: object
        properties:
          traceparent:
            type: string
            description: W3C Trace Context
      payload:
        $ref: '../events/video.normalized.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId. 이 키와 payload sourceId가 같아야 한다.
