# 로컬 개발용 전체 구성. 사용법은 local/README.md를 본다.
# 서비스는 구현이 시작되면 추가한다(ADR-0003). 컨테이너마다 메모리 상한을 둬서 전체가 개발 머신에 올라가게 한다.
name: vlm

services:
  # 서비스마다 자기 DB를 쓰지만(원칙 IV), 로컬은 PostgreSQL 서버 하나에 DB와 계정을 나눠 둔다.
  postgres:
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?local/.env에 POSTGRES_PASSWORD를 넣는다}
      # postgres/init 스크립트가 서비스 계정을 만들 때 쓴다.
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?local/.env에 AUTH_DB_PASSWORD를 넣는다}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:?local/.env에 MEDIA_DB_PASSWORD를 넣는다}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?local/.env에 AI_DB_PASSWORD를 넣는다}
      # local/.env.example에 아직 없어 기존 .env로도 뜨도록 로컬 전용 샘플값을 기본으로 둔다. 바꾸려면 local/.env에 넣는다.
      QUALITY_DB_PASSWORD: ${QUALITY_DB_PASSWORD:-local-quality-pw}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  # api-gateway 전용(알림 티켓 1회용 처리, 요청 수 제한)
  redis:
    image: redis:7.4.12-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128M

  # 서비스 간 이벤트(ADR-0002). 브로커와 컨트롤러를 한 노드에서 돌리는 KRaft 단일 노드다.
  kafka:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 컨테이너끼리는 kafka:19092, 호스트(bootRun, 콘솔 도구)는 localhost:9092로 붙는다.
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # 노드가 하나라 내부 토픽 복제본도 하나다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  # S3 대체 저장소(ADR-0006). 브라우저가 서명된 주소로 localhost:8333에 직접 올린다.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    # POST 정책 서명을 검증하려면 접근 키 설정이 있어야 한다. 키는 로컬 전용 샘플값이다.
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data"]
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "8333:8333"  # S3 API 게이트웨이
      - "9333:9333"  # Master 대시보드 (클러스터/볼륨 상태 확인)
      - "8888:8888"  # Filer 웹 UI (디렉터리/파일 브라우저)
    healthcheck:
      # SeaweedFS는 localhost가 아닌 컨테이너 IP로 열린다.
      test: ["CMD-SHELL", "nc -z \"$$(hostname -i)\" 8333"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          # 231MB 영상을 연속 세 번 업로드·재생하는 E2E에서 최대 1604MiB를 썼다(2026-11-07, 1536M에서 OOM으로 종료).
          memory: 2048M

  # 영상 버킷, 모델 버킷(SPEC-011 인코더 가중치), Golden Set 버킷(SPEC-029 R-14)을 만들고 끝나는 일회성 컨테이너.
  # 운영 Golden Set 버킷은 Versioning·Object Lock을 켜지만(ADR-0011) 로컬은 흐름 확인용이라 켜지 않는다.
  # weed shell은 이미 있는 버킷을 만들면 실패하므로 목록에 없을 때만 만든다.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    entrypoint:
      - sh
      - -c
      - >-
        for b in vlm-media vlm-models vlm-golden; do
        echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 | grep -qw "$$b"
        || echo "s3.bucket.create -name $$b" | weed shell -master=seaweedfs:9333;
        done
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

  auth-service:
    build:
      context: ../repos/backend
      args:
        SERVICE: auth-service
    image: vlm/auth-service:local
    environment:
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/auth_db
      AUTH_DB_USERNAME: auth
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_JWT_ISSUER: vlm-auth-local
      AUTH_JWT_SIGNING_KEY: ${AUTH_JWT_SIGNING_KEY:?local/.env에 AUTH_JWT_SIGNING_KEY를 넣는다}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-}
    # 컨테이너 포트는 운영과 같이 8080이고, 호스트 포트는 서비스 카탈로그의 로컬 포트다.
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

  api-gateway:
    build:
      context: ../repos/backend
      args:
        SERVICE: api-gateway
    image: vlm/api-gateway:local
    environment:
      GATEWAY_JWKS_URI: http://auth-service:8080/.well-known/jwks.json
      GATEWAY_JWT_ISSUER: vlm-auth-local
      # 개발 서버(pnpm dev, 5173)와 frontend 컨테이너(3000) 둘 다 허용한다.
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      GATEWAY_REDIS_HOST: redis
      GATEWAY_REDIS_PORT: "6379"
      AUTH_SERVICE_URI: http://auth-service:8080
      MEDIA_SERVICE_URI: http://media-service:8080
      # quality 프로필로 띄울 때만 응답한다. 없으면 /api/v1/quality/**가 게이트웨이 오류를 돌려준다.
      QUALITY_SERVICE_URI: http://quality-service:8080
    ports:
      - "8080:8080"
    # 공개키 목록은 첫 토큰 검증 때 읽으므로 auth-service가 준비될 때까지 기다리지 않는다.
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M

  media-service:
    build:
      context: ../repos/backend
      args:
        SERVICE: media-service
    image: vlm/media-service:local
    environment:
      MEDIA_DB_URL: jdbc:postgresql://postgres:5432/media_db
      MEDIA_DB_USERNAME: media
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      MEDIA_S3_BUCKET: vlm-media
      MEDIA_S3_REGION: us-east-1
      MEDIA_S3_ENDPOINT: http://seaweedfs:8333
      # 업로드 주소는 브라우저가 부르므로 호스트에서 보이는 주소로 서명한다.
      MEDIA_S3_PUBLIC_ENDPOINT: http://localhost:8333
      MEDIA_S3_PATH_STYLE: "true"
      # seaweedfs/s3.json과 같은 로컬 전용 샘플 키. 운영은 IRSA로 받는다.
      AWS_ACCESS_KEY_ID: local-media-key
      AWS_SECRET_ACCESS_KEY: local-media-secret
      # 보존 키 비밀 키(SPEC-018). Base64로 쓴 로컬 전용 샘플값("local-only-retention-key-not-a-secret")이다.
      # 운영은 Kubernetes Secret으로 넣는다.
      MEDIA_RETENTION_HMAC_KEY: bG9jYWwtb25seS1yZXRlbnRpb24ta2V5LW5vdC1hLXNlY3JldA==
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 768M

  # quality-service(SPEC-029). 검토 큐·Golden Set·평가 기록·처리 단계 측정·긴급 알림 지표. 소비만 하고 발행은 없다.
  # 운영자 API는 게이트웨이(/api/v1/quality/**)로 부른다. quality 프로필로 띄운다.
  quality-service:
    profiles: [quality]
    build:
      context: ../repos/backend
      args:
        SERVICE: quality-service
    image: vlm/quality-service:local
    environment:
      QUALITY_DB_URL: jdbc:postgresql://postgres:5432/quality_db
      QUALITY_DB_USERNAME: quality
      QUALITY_DB_PASSWORD: ${QUALITY_DB_PASSWORD:-local-quality-pw}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      QUALITY_S3_REGION: us-east-1
      QUALITY_S3_ENDPOINT: http://seaweedfs:8333
      # 근거 프레임 주소는 브라우저가 부르므로 호스트에서 보이는 주소로 서명한다.
      QUALITY_S3_PUBLIC_ENDPOINT: http://localhost:8333
      QUALITY_S3_PATH_STYLE: "true"
      QUALITY_SOURCE_BUCKET: vlm-media
      QUALITY_GOLDEN_BUCKET: vlm-golden
      # seaweedfs/s3.json과 같은 로컬 전용 샘플 키(영상 버킷 읽기, Golden Set 버킷 쓰기). 운영은 IRSA로 받는다.
      AWS_ACCESS_KEY_ID: local-quality-key
      AWS_SECRET_ACCESS_KEY: local-quality-secret
    ports:
      - "8088:8080"
    # 토픽 자동 생성을 끈 소비자라 kafka-init이 끝난 뒤에 뜬다.
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          # auth-service·media-service와 같은 값. 힙은 이미지의 MaxRAMPercentage=75로 잡힌다.
          memory: 768M

  # 워커가 구독·발행하는 토픽. 미리 만들어야 재시도 토픽을 바로 구독한다. 이름 원본은 service-contracts/asyncapi다.
  # 재시도는 `<받는 토픽>.<소비 그룹>.retry`, DLQ는 `<소비 그룹>.dlq`다(ai 레포 vlm_messaging.topics).
  # 아직 compose에 없는 서비스(chunk-processor, search-service, analysis-api 등)가 내는 토픽도 받는 쪽이 구독하므로 만든다.
  # 서비스별로 받는·내는 토픽, 재시도·DLQ 순서로 묶는다. 앞 묶음에 이미 있는 토픽은 다시 적지 않는다.
  # stage.timing은 처리 단계 측정 묶음이다(SPEC-013). 보존 7일은 docs overview "처리 단계 측정"과 같다.
  kafka-init:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    entrypoint:
      - sh
      - -c
      - >-
        for topic in video.uploaded video.deleted video.retention.revoked video.normalizing video.normalized
        video.uploaded.normalize.retry normalize.dlq
        video.deleted.ai-gateway.retry ai-gateway.dlq
        segment.ready segment.embedded event.candidate.vector
        segment.ready.frame-encoder.retry frame-encoder.dlq
        event.candidate alert.candidate event.analyzed event.manifest alert.raised
        event.candidate.vector.event-analyzer.retry event.candidate.event-analyzer.retry
        alert.candidate.event-analyzer.retry event-analyzer.dlq
        chunk.boundary track.detected track.manifest
        chunk.boundary.track-stitcher.retry segment.embedded.track-stitcher.retry
        video.deleted.track-stitcher.retry track-stitcher.dlq
        attribute.requested track.analyzed
        attribute.requested.track-analyzer.retry track-analyzer.dlq
        segment.annotated embedding.ready
        event.analyzed.embedding-worker.retry track.analyzed.embedding-worker.retry
        segment.annotated.embedding-worker.retry embedding-worker.dlq
        grounding.requested grounding.completed
        grounding.requested.grounding-worker.retry grounding-worker.dlq
        analysis.completed chunk.manifest source.completed state.updated
        analysis.completed.aggregator.retry event.analyzed.aggregator.retry
        track.detected.aggregator.retry chunk.manifest.aggregator.retry aggregator.dlq; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
        --topic "$$topic" --partitions 3 --replication-factor 1 || exit 1; done &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
        --topic stage.timing --partitions 3 --replication-factor 1
        --config retention.ms=604800000
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  normalize:
    build:
      context: ../repos/ai
      dockerfile: services/normalize/Dockerfile
      target: runtime
    image: vlm/normalize:local
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      S3_BUCKET: vlm-media
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_PATH_STYLE: "true"
      # seaweedfs/s3.json과 같은 로컬 전용 샘플 키. 운영은 IRSA로 받는다.
      AWS_ACCESS_KEY_ID: local-normalize-key
      AWS_SECRET_ACCESS_KEY: local-normalize-secret
      NORMALIZE_WORK_DIR: /work
      # 처리 시간 측정 묶음을 stage.timing에 발행한다. 기본은 JSON 로그(SPEC-013 R-5).
      STAGE_TIMING_PUBLISH: ${STAGE_TIMING_PUBLISH:-false}
    # 원본과 결과를 잠시 두는 폴더. 이미지의 실행 사용자(UID 10001)가 쓸 수 있게 한다.
    tmpfs:
      - /work:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          # 1080p 13분(231MB) 영상 정규화에서 최대 752MiB를 썼다(2026-11-07 E2E).
          memory: 1G

  # frame-encoder(SPEC-019). segment.ready를 받아 벡터 파일을 저장하고 segment.embedded를 발행한다.
  # 기본은 모델 없이 흐름만 보는 mock 프로필이다. 실제 인코더는 가중치를 local/scripts/upload-models.sh로
  # 올린 뒤 FRAME_ENCODER_PROFILE_PATH를 /app/profiles/local.toml로 바꾼다(ai-gateway도 같은 인코더로 맞춘다).
  frame-encoder:
    build:
      context: ../repos/ai
      dockerfile: services/frame-encoder/Dockerfile
      target: runtime
    image: vlm/frame-encoder:local
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      S3_BUCKET: vlm-media
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_PATH_STYLE: "true"
      # seaweedfs/s3.json과 같은 로컬 전용 샘플 키. 운영은 IRSA로 받는다.
      AWS_ACCESS_KEY_ID: local-frame-encoder-key
      AWS_SECRET_ACCESS_KEY: local-frame-encoder-secret
      FRAME_ENCODER_PROFILE_PATH: ${FRAME_ENCODER_PROFILE_PATH:-/app/profiles/local-mock.toml}
      # mock 인코더는 로컬·CI 전용이다.
      FRAME_ENCODER_ALLOW_MOCK: "true"
      FRAME_ENCODER_MODELS_BUCKET: vlm-models
      # 처리 시간 측정 묶음을 stage.timing에 발행한다. 기본은 JSON 로그(SPEC-013 R-5).
      STAGE_TIMING_PUBLISH: ${STAGE_TIMING_PUBLISH:-false}
    # 받은 가중치를 남겨 재시작 때 다시 받지 않는다(운영은 Pod의 emptyDir).
    volumes:
      - frame-encoder-models:/var/cache/vlm-models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          # docs overview "로컬 메모리" 표
          memory: 1G

  # event-analyzer(SPEC-020·023). 벡터 후보(event.candidate.vector), 탐지기·규칙 후보(event.candidate),
  # 긴급 후보(alert.candidate)를 ai-gateway로 판정해 event.analyzed·event.manifest·alert.raised를 발행한다.
  # 판정 모델은 ai-gateway 프로필이 정한다(기본 mock, Ollama는 AI_GATEWAY_PROFILE_PATH=/app/profiles/local.toml).
  event-analyzer:
    build:
      context: ../repos/ai
      dockerfile: services/event-analyzer/Dockerfile
      target: runtime
    image: vlm/event-analyzer:local
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      EVENT_ANALYZER_AI_GATEWAY_URL: http://ai-gateway:8000
      # 후보 파일(candidatesKey)을 읽는 영상 버킷(SPEC-023). 이미지의 판정 규칙 프로필(/app/profiles/local.toml)을 쓴다.
      S3_BUCKET: vlm-media
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_PATH_STYLE: "true"
      # seaweedfs/s3.json과 같은 로컬 전용 샘플 키(읽기 전용). 운영은 IRSA로 받는다.
      AWS_ACCESS_KEY_ID: local-event-analyzer-key
      AWS_SECRET_ACCESS_KEY: local-event-analyzer-secret
      # 실시간 재판정 간격 상태(SPEC-023 R-18). 끊겨도 창마다 판정하므로 depends_on에 넣지 않는다.
      # 서비스마다 Redis DB 번호를 나눠 키가 섞이지 않게 한다(ai-gateway 0).
      EVENT_ANALYZER_REDIS_URL: redis://redis:6379/1
      # 처리 시간 측정 묶음을 stage.timing에 발행한다. 기본은 JSON 로그(SPEC-013 R-5).
      STAGE_TIMING_PUBLISH: ${STAGE_TIMING_PUBLISH:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
      ai-gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # docs 아키텍처 18.1절 "로컬 개발 환경" 표의 나머지 워커
          memory: 256M

  # 아래 워커와 quality-service는 compose 프로필로 묶었다. 모두 띄우면 메모리 상한 합이 Docker 8GB를 넘으므로
  # 필요한 묶음만 --profile로 고른다(local/README.md "프로필"). 기본 구성에 들어 있는 서비스에는 의존만 한다.

  # track-stitcher(SPEC-022). chunk.boundary·segment.embedded로 청크 사이 트랙을 잇고 번역표와
  # track.detected·track.manifest를 낸다. chunk.boundary를 내는 chunk-processor는 아직 compose에 없다.
  track-stitcher:
    profiles: [analysis]
    build:
      context: ../repos/ai
      dockerfile: services/track-stitcher/Dockerfile
      target: runtime
    image: vlm/track-stitcher:local
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      # Job 대기 상태(키 접두사 ts:). 필수라 depends_on에 넣는다.
      TRACK_STITCHER_REDIS_URL: redis://redis:6379/2
      S3_BUCKET: vlm-media
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_PATH_STYLE: "true"
      # seaweedfs/s3.json과 같은 로컬 전용 샘플 키. 운영은 IRSA로 받는다.
      AWS_ACCESS_KEY_ID: local-track-stitcher-key
      AWS_SECRET_ACCESS_KEY: local-track-stitcher-secret
      STAGE_TIMING_PUBLISH: ${STAGE_TIMING_PUBLISH:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256M

  # track-analyzer(SPEC-024). attribute.requested마다 ai-gateway track_attribute·object_question을 한 번 부르고
  # track.analyzed를 낸다. 저장소는 쓰지 않는다. attribute.requested를 내는 analysis-api는 아직 compose에 없다.
  track-analyzer:
    profiles: [analysis]
    build:
      context: ../repos/ai
      dockerfile: services/track-analyzer/Dockerfile
      target: runtime
    image: vlm/track-analyzer:local
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      TRACK_ANALYZER_AI_GATEWAY_URL: http://ai-gateway:8000
      STAGE_TIMING_PUBLISH: ${STAGE_TIMING_PUBLISH:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      ai-gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # embedding-worker(SPEC-025). event.analyzed·track.analyzed·segment.annotated의 문장을 ai-gateway embed_text로
  # 벡터 파일에 저장하고 embedding.ready를 낸다. mock 프로필은 의미 없는 결정적 벡터를 돌려준다.
  # 실제 텍스트 임베딩은 ai-gateway를 local.toml(호스트 Ollama bge-m3)로 띄운다.
  embedding-worker:
    profiles: [analysis]
    build:
      context: ../repos/ai
      dockerfile: services/embedding-worker/Dockerfile
      target: runtime
    image: vlm/embedding-worker:local
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      EMBEDDING_WORKER_AI_GATEWAY_URL: http://ai-gateway:8000
      # 번역표를 읽고 텍스트 벡터 파일을 쓰는 영상 버킷. 변수 이름은 vlm_storage.s3.StorageSettings(S3_ 접두사)가 원본이다.
      S3_BUCKET: vlm-media
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_PATH_STYLE: "true"
      # seaweedfs/s3.json과 같은 로컬 전용 샘플 키. 운영은 IRSA로 받는다.
      AWS_ACCESS_KEY_ID: local-embedding-worker-key
      AWS_SECRET_ACCESS_KEY: local-embedding-worker-secret
      STAGE_TIMING_PUBLISH: ${STAGE_TIMING_PUBLISH:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
      ai-gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # aggregator(SPEC-027·028). job 단위 병합·위험 상태·요약 결과 파일과 source.completed, 실시간 창 fold의
  # state.updated를 낸다. 읽기 원본인 analysis-api와 stream-service는 아직 compose에 없어 내부 읽기가 실패하면
  # 재시도 뒤 DLQ로 간다. 주소는 compose 규칙(컨테이너 포트 8080)으로 미리 적어 둔다.
  aggregator:
    profiles: [analysis]
    build:
      context: ../repos/ai
      dockerfile: services/aggregator/Dockerfile
      target: runtime
    image: vlm/aggregator:local
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      AGGREGATOR_AI_GATEWAY_URL: http://ai-gateway:8000
      AGGREGATOR_ANALYSIS_API_URL: http://analysis-api:8080
      # 비우면 STREAM 메시지는 재시도 뒤 DLQ로 간다. stream-service를 compose에 더하면 주소를 넣는다.
      AGGREGATOR_STREAM_SERVICE_URL: ""
      # 대기 집합·세션 상태·재판정 계수. 운영 필수라 로컬도 붙인다.
      AGGREGATOR_REDIS_URL: redis://redis:6379/3
      S3_BUCKET: vlm-media
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_PATH_STYLE: "true"
      # seaweedfs/s3.json과 같은 로컬 전용 샘플 키. 운영은 IRSA로 받는다.
      AWS_ACCESS_KEY_ID: local-aggregator-key
      AWS_SECRET_ACCESS_KEY: local-aggregator-secret
      STAGE_TIMING_PUBLISH: ${STAGE_TIMING_PUBLISH:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
      ai-gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # SPEC-027 NFR-2
          memory: 256M

  # grounding-worker(SPEC-026). grounding.requested의 구간마다 정규화 영상에서 프레임을 뽑아 대상어 박스를 그린
  # 클립과 결과 파일을 저장하고 grounding.completed를 낸다. grounding.requested를 내는 search-service는 아직 compose에 없다.
  # 기본은 mock 탐지기라 박스에 의미가 없다. 실제 탐지기 프로필(local.toml)은 ai 레포 SPEC-026 tasks T026~T028에서
  # 더한 뒤 GROUNDING_WORKER_PROFILE_PATH를 바꾸고 GROUNDING_WORKER_ALLOW_MOCK을 지운다.
  grounding-worker:
    profiles: [grounding]
    build:
      context: ../repos/ai
      dockerfile: services/grounding-worker/Dockerfile
      target: runtime
    image: vlm/grounding-worker:local
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      S3_BUCKET: vlm-media
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_PATH_STYLE: "true"
      # seaweedfs/s3.json과 같은 로컬 전용 샘플 키. 운영은 IRSA로 받는다.
      AWS_ACCESS_KEY_ID: local-grounding-worker-key
      AWS_SECRET_ACCESS_KEY: local-grounding-worker-secret
      GROUNDING_WORKER_PROFILE_PATH: ${GROUNDING_WORKER_PROFILE_PATH:-/app/profiles/local-mock.toml}
      # mock 탐지기는 로컬·CI 전용이다.
      GROUNDING_WORKER_ALLOW_MOCK: "true"
      STAGE_TIMING_PUBLISH: ${STAGE_TIMING_PUBLISH:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          # SPEC-026 NFR-2, docs 아키텍처 18.1절 표. ffmpeg 인코딩이 이 안에서 돈다.
          memory: 1536M

  # ai-gateway(SPEC-009). 마이그레이션을 먼저 한 번 실행하고 서버를 띄운다.
  # 기본은 모델 없이 흐름만 보는 mock 프로필이다. Ollama를 쓰려면 호스트에서 Ollama를 띄우고
  # AI_GATEWAY_PROFILE_PATH를 /app/profiles/local.toml로 바꾼다(local/README.md).
  ai-gateway-migrate:
    build: &ai-gateway-build
      context: ../repos/ai
      dockerfile: services/ai-gateway/Dockerfile
      # 프롬프트·분류 체계는 docs 계약에서 이미지로 넣는다.
      additional_contexts:
        vlm-contracts:docs: ../service-contracts
    image: vlm/ai-gateway:local
    command: ["python", "-m", "ai_gateway.db.migrate"]
    environment:
      AI_GATEWAY_DATABASE_URL: postgresql+asyncpg://ai:${AI_DB_PASSWORD}@postgres:5432/ai_db
      AI_GATEWAY_PROFILE_PATH: /app/profiles/local-mock.toml
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ai-gateway:
    build: *ai-gateway-build
    image: vlm/ai-gateway:local
    environment:
      AI_GATEWAY_DATABASE_URL: postgresql+asyncpg://ai:${AI_DB_PASSWORD}@postgres:5432/ai_db
      AI_GATEWAY_PROFILE_PATH: ${AI_GATEWAY_PROFILE_PATH:-/app/profiles/local-mock.toml}
      # mock Adapter는 로컬·CI 전용이다(SPEC-009 R-15).
      AI_GATEWAY_ALLOW_MOCK: "true"
      KAFKA_BOOTSTRAP: kafka:19092
      S3_BUCKET: vlm-media
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_PATH_STYLE: "true"
      # seaweedfs/s3.json과 같은 로컬 전용 샘플 키(읽기 전용). 운영은 IRSA로 받는다.
      AWS_ACCESS_KEY_ID: local-ai-gateway-key
      AWS_SECRET_ACCESS_KEY: local-ai-gateway-secret
      # 인코더 가중치를 받는 버킷(SPEC-011). 가중치는 local/scripts/upload-models.sh로 한 번 올린다.
      AI_GATEWAY_MODELS_BUCKET: vlm-models
      # 비우면 이미지의 Registry·프로필을 쓴다. local/scripts/upload-registry.sh가 출력한 값을 .env에 넣으면
      # 모델 버킷의 묶음을 받아 쓴다(SPEC-009 R-26). 그때 AI_GATEWAY_PROFILE_PATH는 묶음 안 상대 경로다.
      AI_GATEWAY_REGISTRY_BUNDLE: ${AI_GATEWAY_REGISTRY_BUNDLE:-}
      AI_GATEWAY_REGISTRY_BUNDLE_SHA256: ${AI_GATEWAY_REGISTRY_BUNDLE_SHA256:-}
      # video.deleted 소비의 처리 시간 측정 묶음을 stage.timing에 발행한다(SPEC-013).
      AI_GATEWAY_STAGE_TIMING_PUBLISH: ${AI_GATEWAY_STAGE_TIMING_PUBLISH:-false}
      # 결과 캐시 앞단·동시 호출 잠금·분당 한도(SPEC-016). Redis가 없어도 ai-gateway는 DB 캐시와
      # Pod별 한도로 동작하므로 depends_on에 넣지 않는다(R-17).
      AI_GATEWAY_REDIS_URL: redis://redis:6379/0
    # 받은 가중치를 남겨 재시작 때 다시 받지 않는다(운영은 Pod의 emptyDir).
    volumes:
      - ai-gateway-models:/var/cache/vlm-models
    # 프로필(local.toml)은 호스트의 Ollama를 host.docker.internal로 부른다. Mac의 Docker는 GPU를
    # 못 써서 Ollama는 호스트에서 Metal로 돌린다. Linux에도 같은 이름이 생기도록 연결해 둔다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 내부 전용 서비스지만 로컬에서 직접 불러 보려고 호스트에 연다(docs 서비스 카탈로그 로컬 포트).
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      ai-gateway-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          # docs overview "로컬 메모리" 표
          memory: 768M

  frontend:
    build:
      context: ../repos/frontend
      args:
        # 브라우저가 호출할 주소라서 컨테이너 이름이 아니라 호스트의 게이트웨이 포트를 쓴다.
        VITE_API_BASE_URL: http://localhost:8080
        # .env.compose를 읽어 로그인 칸에 샘플 관리자 계정(AUTH_ADMIN_*)을 미리 채운다.
        BUILD_MODE: compose
    image: vlm/frontend:local
    # 5173은 개발 서버(pnpm dev)가 쓰므로 둘을 함께 띄울 수 있게 3000을 쓴다.
    ports:
      - "3000:8080"
    depends_on:
      api-gateway:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  postgres-data:
  seaweedfs-data:
  ai-gateway-models:
  frame-encoder-models:
