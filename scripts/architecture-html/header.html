<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg:#f3f5f7; --paper:#ffffff; --ink:#18222d; --muted:#5b6875; --line:#c9d1d9;
  --edge:#5a4fb0; --spring:#2f7d4f; --py:#2c62a6; --ai:#0f7a76; --store:#a2650e;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#11161c; --paper:#182029; --ink:#e3e9ef; --muted:#98a5b2; --line:#2e3a46;
          --edge:#a99ff0; --spring:#6cc293; --py:#74a8e8; --ai:#5fcfc8; --store:#e0a552; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { scroll-padding-top: 16px; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.65; font-size:15px; }
.layout { display:grid; grid-template-columns: 280px minmax(0,1fr); gap:32px; max-width:1480px; margin:0 auto; padding:32px 24px 72px; }
nav#TOC { position:sticky; top:16px; align-self:start; max-height:calc(100vh - 32px); overflow:auto; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px 16px; font-size:13px; }
nav#TOC ul { list-style:none; margin:0; padding-left:0; }
nav#TOC ul ul { padding-left:14px; }
nav#TOC li { margin:3px 0; }
nav#TOC a { color:var(--muted); text-decoration:none; }
nav#TOC a:hover { color:var(--edge); }
main { min-width:0; }
header.title { margin-bottom:28px; }
.eyebrow { font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
h1 { margin:4px 0 8px; font-size:clamp(24px,3vw,34px); font-weight:700; letter-spacing:-.01em; }
h2 { margin:48px 0 12px; font-size:22px; font-weight:700; padding-bottom:6px; border-bottom:2px solid var(--line); }
h3 { margin:28px 0 8px; font-size:17px; font-weight:700; color:var(--edge); }
p { margin:10px 0; max-width:92ch; }
blockquote { margin:14px 0; padding:12px 16px; background:var(--paper); border-left:4px solid var(--edge); border-radius:0 10px 10px 0; color:var(--muted); }
blockquote p { margin:0; max-width:none; }
code { font-family:var(--font-mono); font-size:.88em; background:color-mix(in srgb,var(--line) 35%,transparent); padding:1px 5px; border-radius:5px; }
pre { background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:12px 14px; overflow:auto; font-family:var(--font-mono); font-size:13px; }
pre code { background:none; padding:0; }
pre.mermaid { background:var(--paper); display:flex; justify-content:center; overflow:auto; padding:16px; }
pre.mermaid svg { max-width:100%; height:auto; }
table { border-collapse:collapse; width:100%; margin:12px 0 18px; background:var(--paper); border:1px solid var(--line); border-radius:10px; overflow:hidden; font-size:13.5px; display:block; overflow-x:auto; }
th, td { border-bottom:1px solid var(--line); padding:8px 10px; vertical-align:top; text-align:left; }
th { background:color-mix(in srgb,var(--line) 30%,var(--paper)); font-weight:600; white-space:nowrap; }
tr:last-child td { border-bottom:none; }
td:first-child { white-space:nowrap; font-weight:600; }
ul, ol { padding-left:22px; }
li { margin:4px 0; }
a { color:var(--edge); }
strong { font-weight:700; }
hr { border:none; border-top:1px solid var(--line); margin:32px 0; }
@media (max-width: 960px) { .layout { grid-template-columns:1fr; } nav#TOC { position:static; max-height:none; } }
</style>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({ startOnLoad: true, theme: dark ? "dark" : "neutral", securityLevel: "loose",
  flowchart: { htmlLabels: true, curve: "basis" }, sequence: { useMaxWidth: true, mirrorActors: false } });
</script>
