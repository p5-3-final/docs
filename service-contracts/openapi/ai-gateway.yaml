openapi: 3.1.0
info:
  title: ai-gateway API
  version: 1.5.0
  description: |
    외부 AI 호출 관문(내부 전용). 워커와 search-service가 클러스터 안에서 직접 부르고, api-gateway는 라우팅하지 않는다. (SPEC-009)
    taskType별 입력 변수·출력 형식의 원본은 ai 레포 `services/ai-gateway/registry/prompts/<taskType>/`의 `input.schema.json`, `output.schema.json`이다(docs ADR-0012).
    이미지는 저장소 경로로만 넘기며, 허용 패턴에 맞는 블러 사본 경로만 받는다. (SPEC-009 R-9, R-10)
    `/v1/embed`는 질의·텍스트·이미지 벡터를 만든다. 검색용 이미지는 taskType별 허용 패턴(질의 전용 폴더)의 경로만 받는다. (SPEC-011)
    `/v1/parse`는 검색 문장을 표준 질의로 해석한다. 질의 사전과 `query_parse` 프롬프트의 원본은 ai 레포 Prompt Registry다. (SPEC-012)
    호출자는 `X-Request-Deadline`(epoch ms)을 싣는다. 남은 시간이 외부 모델 제한 시간이 되고, 남은 시간이 없으면 처리하지 않고 504다. (SPEC-021, overview "통신 규칙" 내부 동기 호출 규약)
    외부 모델을 부르는 경로(`/v1/analyze`, `/v1/parse`의 LLM 보조, `embed_text`)는 결과 캐시·예산·분당 한도를 거친다. 캐시에 있는 입력이면 모델을 부르지 않고 같은 결과를 새 호출 ID로 돌려준다. 예산(호출 서비스별·전체 하루)을 넘으면 모델 미설정과 같은 결과다. (SPEC-016)
servers:
  - url: http://ai-gateway:8000
    description: 클러스터 내부 주소 (로컬 compose 서비스 이름 기준)
tags:
  - name: internal
    description: 클러스터 내부 전용
paths:
  /v1/analyze:
    post:
      operationId: analyze
      summary: 이미지와 입력 변수로 VLM 분석
      description: |
        taskType의 프롬프트로 모델을 부르고, 응답을 그 taskType의 출력 스키마로 검증해 돌려준다.
        - 출력 검증에 실패하면 200으로 `verificationStatus: unknown`인 결과를 돌려준다. (SPEC-009 R-6)
        - 그 taskType의 모델이 설정되지 않았으면 모델을 부르지 않고 200으로 `verificationStatus: unverified`인 결과를 돌려준다. 이때 `modelId`는 null이다. (R-8)
        - 다시 시도할지는 호출자가 정한다. 같은 요청을 다시 보내면 새 호출로 기록된다.
        - 성공한 결과는 이미지 내용·입력 변수·taskType·모델·프롬프트 버전으로 저장해 두고, 같은 입력이면 모델을 부르지 않고 같은 `output`을 돌려준다. (SPEC-016 R-1, R-2)
        - 호출 서비스나 전체의 하루 예산을 넘으면 모델을 부르지 않고 200으로 `verificationStatus: unverified`인 결과를 돌려준다. `modelId`는 null이다. (SPEC-016 R-11)
      tags: [internal]
      # 토큰 인증 없이 클러스터 내부 접근 제한(NetworkPolicy)과 호출자 헤더 허용 목록으로 막는다. ServiceAccount 토큰 검증은 배포 spec에서 정한다.
      security: []
      parameters:
        - $ref: '#/components/parameters/XCaller'
        - $ref: '#/components/parameters/TraceParent'
        - $ref: '#/components/parameters/XRequestDeadline'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
            example:
              taskType: event_judge
              sourceId: 0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f
              images:
                - storageKey: sources/0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f/chunks/0/candidates/c1/blurred/000.jpg
                  ptsSec: 61.2
                - storageKey: sources/0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f/chunks/0/candidates/c1/blurred/001.jpg
                  ptsSec: 63.7
              variables:
                eventType: fall
                startSec: 61.2
                endSec: 66.2
                zoneName: A동 적재 구역
                evidence:
                  triggerClass: fallen_person
                  score: 0.82
      responses:
        '200':
          description: 분석 결과. 모델 미설정·출력 검증 실패도 200이며 `output.verificationStatus`로 구분한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResponse'
              example:
                callId: 0192f0e1-0000-7000-8000-000000000001
                taskType: event_judge
                modelId: gpt-6.1-terra
                promptVersion: event_judge@3f2a9c1d7b4e
                taxonomyVersion: v2
                output:
                  eventType: fall
                  eventDetected: true
                  verificationStatus: confirmed
                  description: 적재 구역에서 작업자 한 명이 지게차 옆에 넘어져 일어나지 못하고 있다.
                  beforeState: 작업자가 지게차 옆을 걸어가고 있다.
                  afterState: 작업자가 바닥에 누워 움직이지 않는다.
                  riskDetected: true
                  riskType: worker_down
                  riskReason: 쓰러진 작업자 옆에서 지게차가 계속 움직이고 있다.
                  solution: 지게차 운행을 멈추고 작업자 상태를 확인한다.
                  severity: high
                  evidenceStart: 62.0
                  evidenceEnd: 65.5
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/ProviderFailed'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        '504':
          $ref: '#/components/responses/DeadlineExceeded'
  /v1/embed:
    post:
      operationId: embed
      summary: 문장이나 이미지를 벡터로 바꿈
      description: |
        입력 순서대로 벡터를 돌려준다. 벡터는 모두 길이 1로 정규화되어 있다. (SPEC-011 R-1~R-4)
        - `embed_visual_text`·`embed_image`는 ai-gateway 안의 이미지·질의 인코더로 만들고, `modelId`는 frame-encoder의 `embedding_model`과 같은 문자열이다. VLM·텍스트 임베딩 공급자 상태와 상관없이 동작한다. (R-6, R-22)
        - `embed_text`는 텍스트 임베딩 공급자를 부른다.
        - 같은 모델로 같은 입력을 다시 보내면 같은 벡터(코사인 유사도 0.9999 이상)를 받는다. (R-5)
        - 호출 로그에는 입력 수·지연·상태만 남고 벡터와 문장 원문은 남지 않는다. (R-23)
        - `embed_text`는 문장마다 캐시를 찾아 없는 문장만 공급자에 보낸다. 예산을 넘으면 429 `AI_BUDGET_EXCEEDED`다. (SPEC-016 R-5, R-11)
      tags: [internal]
      # /v1/analyze와 같은 이유로 토큰 인증 없이 NetworkPolicy와 호출자 헤더 허용 목록으로 막는다.
      security: []
      parameters:
        - $ref: '#/components/parameters/XCaller'
        - $ref: '#/components/parameters/TraceParent'
        - $ref: '#/components/parameters/XRequestDeadline'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedRequest'
            examples:
              visualText:
                summary: 시각 검색 질의 문장
                value:
                  taskType: embed_visual_text
                  texts: [a forklift passing by]
              image:
                summary: 검색용 이미지
                value:
                  taskType: embed_image
                  images:
                    - storageKey: queries/0192f0d2-9a8b-7c6d-8e4f-5a6b7c8d9e0f/query.jpg
              text:
                summary: 이벤트 설명문
                value:
                  taskType: embed_text
                  texts: [적재 구역에서 작업자 한 명이 지게차 옆에 넘어져 일어나지 못하고 있다.]
      responses:
        '200':
          description: 입력 순서대로 만든 벡터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedResponse'
              example:
                callId: 0192f0e1-0000-7000-8000-000000000002
                taskType: embed_visual_text
                modelId: open_clip:MobileCLIP2-S0:dfndr2b:mean-4
                dimension: 4
                vectors:
                  - [0.5, -0.5, 0.5, 0.5]
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/EmbedLimited'
        '502':
          $ref: '#/components/responses/ProviderFailed'
        '503':
          $ref: '#/components/responses/EmbedUnavailable'
        '504':
          $ref: '#/components/responses/DeadlineExceeded'
  /v1/parse:
    post:
      operationId: parse
      summary: 검색 문장을 표준 질의로 해석
      description: |
        질의 사전으로 먼저 해석하고, 사전에 맞는 한국어 표현이 없을 때만 영어 구문 처리나 LLM(`query_parse`)을 쓴다. (SPEC-012 R-3~R-11)
        - LLM이 미설정이거나 실패해도 오류가 아니라 200으로 `parseMethod: safe-fallback`, 대상어 `person`인 결과를 돌려준다. (R-12~R-14)
        - route는 해석 방법과 상관없이 사전으로만 정한다. (R-15)
        - 같은 사전·프롬프트로 같은 문장을 다시 보내면 같은 표준 질의를 받는다.
        - 호출 로그에는 검색 문장 원문과 모델 원문이 남지 않는다. (R-27)
        - LLM 보조 결과는 캐시해 같은 정규화 문장이면 다시 부르지 않는다. 예산을 넘으면 200 `safe-fallback`이다. (SPEC-016 R-2, R-11)
      tags: [internal]
      # /v1/analyze와 같은 이유로 토큰 인증 없이 NetworkPolicy와 호출자 헤더 허용 목록으로 막는다.
      security: []
      parameters:
        - $ref: '#/components/parameters/XCaller'
        - $ref: '#/components/parameters/TraceParent'
        - $ref: '#/components/parameters/XRequestDeadline'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseRequest'
            example:
              query: 안전모 안 쓴 작업자 찾아줘
      responses:
        '200':
          description: 표준 질의. `safe-fallback`도 200이며 `parseMethod`로 구분한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResponse'
              example:
                callId: 0192f0e1-0000-7000-8000-000000000003
                route: video_retrieval
                targets: [person without a hard hat]
                eventTypes: [ppe_missing]
                visualQuery: a photo of person without a hard hat
                parseMethod: industrial-rule
                rationale: '사전 표현: 안전모를 안'
                dictionaryVersion: v1@4d1c0a9e7b2f
                promptVersion: null
                taxonomyVersion: v2
                canonicalQuery: 'v1:video_retrieval|person without a hard hat|ppe_missing|industrial-rule|v1@4d1c0a9e7b2f|v2'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '504':
          $ref: '#/components/responses/DeadlineExceeded'
components:
  parameters:
    XCaller:
      name: X-Caller
      in: header
      required: true
      description: 호출하는 서비스 이름. 허용 호출자 목록(설정)에 있어야 하고, 호출 로그의 호출자로 남는다. (SPEC-009 R-16, R-17)
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{1,62}$'
      example: event-analyzer
    XRequestDeadline:
      name: X-Request-Deadline
      in: header
      required: false
      description: |
        호출자가 결과를 기다리는 마감 시각(Unix epoch 밀리초). 받은 시각부터 남은 시간과 프로필 제한 시간 중 짧은 것이 외부 모델 호출의 제한 시간이다.
        남은 시간이 없으면 저장소·캐시·예산·모델을 부르지 않고 504 `AI_DEADLINE_EXCEEDED`다. 0 이상의 정수가 아니면 400 `AI_INVALID_REQUEST`다. 없으면 프로필 제한 시간만 쓴다. (SPEC-021 R-1~R-5)
      schema:
        type: string
        pattern: '^[0-9]{1,16}$'
      example: '1793947448160'
    TraceParent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context. 있으면 로그와 공급자 호출에 같은 추적 ID를 남긴다. (SPEC-009 NFR-5)
      schema:
        type: string
        pattern: '^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
      example: 00-0123456789abcdef0123456789abcdef-0123456789abcdef-01
  responses:
    BadRequest:
      description: |
        요청 형식이나 입력 변수가 입력 스키마와 맞지 않음 (`AI_INVALID_REQUEST`), 모르는 taskType (`AI_UNKNOWN_TASK_TYPE`),
        이미지 수가 taskType 상한을 넘음 (`AI_TOO_MANY_IMAGES`), 저장소에 없는 이미지 (`AI_IMAGE_NOT_FOUND`). (SPEC-009 R-2~R-4, R-11)
        `/v1/embed`: 입력 수가 taskType 상한을 넘음 (`AI_TOO_MANY_INPUTS`), 디코딩할 수 없는 이미지 (`AI_IMAGE_UNREADABLE`).
        taskType에 맞지 않는 입력 종류·빈 목록·빈 문장·길이 상한을 넘는 문장은 `AI_INVALID_REQUEST`다. (SPEC-011 R-7~R-9, R-11, R-12, R-26)
        `/v1/parse`: 빈 문장, 정규화 뒤 빈 문장, 길이 상한(프로필 값)을 넘는 문장은 `AI_INVALID_REQUEST`다. (SPEC-012 R-20, R-21)
        `X-Request-Deadline`이 0 이상의 정수가 아니면 `AI_INVALID_REQUEST`다. (SPEC-021 R-4)
      content:
        application/problem+json:
          schema:
            $ref: './_common.yaml#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: 이미지는 최대 12장까지 보낼 수 있습니다.
            code: AI_TOO_MANY_IMAGES
    Forbidden:
      description: |
        호출자 헤더가 없거나 허용 목록에 없음 (`AI_CALLER_FORBIDDEN`),
        이미지 경로가 허용 패턴 밖이거나 요청한 영상 폴더 밖 (`AI_IMAGE_PATH_FORBIDDEN`). 원본·정규화 사본·HLS 경로도 여기에 해당한다. (SPEC-009 R-9, R-10, R-16)
        `/v1/embed`의 이미지 경로는 taskType별 허용 패턴을 따른다. (SPEC-011 R-10, R-13)
      content:
        application/problem+json:
          schema:
            $ref: './_common.yaml#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: 블러 사본 경로만 보낼 수 있습니다.
            code: AI_IMAGE_PATH_FORBIDDEN
    ProviderFailed:
      description: 공급자가 요청 자체를 거부함(인증 실패, 잘못된 요청 등 429 외 4xx) (`AI_PROVIDER_FAILED`). 같은 요청을 다시 보내도 같은 결과일 가능성이 높다. (SPEC-009 R-19)
      content:
        application/problem+json:
          schema:
            $ref: './_common.yaml#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Bad Gateway
            status: 502
            detail: 공급자가 요청을 거부했습니다.
            code: AI_PROVIDER_FAILED
    ProviderUnavailable:
      description: 공급자가 제한 시간 안에 응답하지 않음, 연결할 수 없음, 429·5xx (`AI_PROVIDER_UNAVAILABLE`). 다시 시도할 수 있다. (SPEC-009 R-18)
      content:
        application/problem+json:
          schema:
            $ref: './_common.yaml#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            detail: 모델을 일시적으로 사용할 수 없습니다.
            code: AI_PROVIDER_UNAVAILABLE
    RateLimited:
      description: |
        그 taskType의 제한 시간 안에 공급자 분당 한도의 차례를 얻지 못함 (`AI_RATE_LIMITED`). 공급자에 보내지 않았으므로 비용이 들지 않았다.
        ai-gateway가 이미 제한 시간까지 기다렸으므로 호출자는 바로 다시 보내지 않고, 워커는 메시지 재시도처럼 시간을 두고 다시 처리한다. (SPEC-016 R-16)
      content:
        application/problem+json:
          schema:
            $ref: './_common.yaml#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: 모델 분당 호출 한도에 걸렸습니다.
            code: AI_RATE_LIMITED
    EmbedLimited:
      description: |
        `embed_text`: 그 taskType의 제한 시간 안에 공급자 분당 한도의 차례를 얻지 못함 (`AI_RATE_LIMITED`). 시간을 두고 다시 보낼 수 있다. (SPEC-016 R-16)
        `embed_text`: 호출 서비스나 전체의 하루 예산을 넘음 (`AI_BUDGET_EXCEEDED`). 다음 날(UTC)이나 한도를 늘리기 전에는 다시 보내도 같은 결과다. (SPEC-016 R-11)
      content:
        application/problem+json:
          schema:
            $ref: './_common.yaml#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: 하루 AI 예산을 모두 썼습니다.
            code: AI_BUDGET_EXCEEDED
    DeadlineExceeded:
      description: |
        `X-Request-Deadline`까지 남은 시간이 없어 처리하지 않았거나, 남은 시간 안에 외부 모델 호출이 끝나지 않음 (`AI_DEADLINE_EXCEEDED`).
        호출자가 이미 기다리지 않는 요청이다. analyze는 다시 보내지 않는다(비용이 두 번 들 수 있다). (SPEC-021 R-2, R-3)
      content:
        application/problem+json:
          schema:
            $ref: './_common.yaml#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Gateway Timeout
            status: 504
            detail: 요청 마감 시각이 지났습니다.
            code: AI_DEADLINE_EXCEEDED
    EmbedUnavailable:
      description: |
        텍스트 임베딩 공급자가 제한 시간 안에 응답하지 않음, 연결할 수 없음, 429·5xx (`AI_PROVIDER_UNAVAILABLE`). 다시 시도할 수 있다. (SPEC-011 R-20)
        그 taskType의 모델이 프로필에 없음 (`AI_MODEL_NOT_CONFIGURED`). 설정을 바꾸기 전에는 다시 보내도 같은 결과다. (SPEC-011 R-14)
      content:
        application/problem+json:
          schema:
            $ref: './_common.yaml#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            detail: 이 작업의 모델이 설정되지 않았습니다.
            code: AI_MODEL_NOT_CONFIGURED
  schemas:
    ParseRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          description: 사용자의 검색 문장(한국어·영어). 길이 상한은 프로필 값이다. (SPEC-012 R-20, R-21)
    QueryRoute:
      type: string
      description: |
        검색 경로. (SPEC-012 R-3, R-4)
        - `video_retrieval`: 장면 찾기
        - `temporal_video_rag`: 시간·상태 질문 답변(사전의 시간·상태 표현이 있을 때)
      enum: [video_retrieval, temporal_video_rag]
    ParseMethod:
      type: string
      description: |
        해석 방법. (SPEC-012 R-5, R-8, R-9, R-11~R-14)
        - `industrial-rule`: 질의 사전의 한국어 표현
        - `english-phrase`: 영어 위주 문장에서 불용어를 지운 구문
        - `llm`: `query_parse` 모델 출력
        - `safe-fallback`: 위 방법으로 해석하지 못해 대상어를 `person`으로 제한함
      enum: [industrial-rule, english-phrase, llm, safe-fallback]
    ParseResponse:
      type: object
      required: [callId, route, targets, eventTypes, visualQuery, parseMethod, rationale, dictionaryVersion, promptVersion, taxonomyVersion, canonicalQuery]
      properties:
        callId:
          type: string
          format: uuid
          description: 호출 ID. 호출 로그를 찾는 키다. (SPEC-012 R-1, R-27)
        route:
          $ref: '#/components/schemas/QueryRoute'
        targets:
          type: array
          minItems: 1
          maxItems: 3
          description: 영어 시각 대상어. bbox 주석(grounding) 대상으로 쓴다. (R-5, R-8, R-11)
          items:
            type: string
            pattern: '^[a-z0-9][a-z0-9 -]*$'
            maxLength: 64
        eventTypes:
          type: array
          description: 분류 체계 이벤트 유형(`other` 제외). 텍스트 인덱스 필터로 쓴다. 맞은 유형이 없으면 빈 목록이다. (R-7, R-11)
          uniqueItems: true
          items:
            $ref: '../taxonomy/v2/taxonomy.schema.json#/$defs/detectableEventType'
        visualQuery:
          type: string
          minLength: 1
          description: 대상어로 만든 영어 검색 문장. `embed_visual_text`의 입력으로 쓴다. 같은 대상어 목록이면 같은 문장이다. (R-16)
        parseMethod:
          $ref: '#/components/schemas/ParseMethod'
        rationale:
          type: string
          description: 해석 근거(해석 방법과 맞은 사전 표현). LLM 출력의 설명문은 넣지 않는다. 사람이 읽는 값이라 형식에 의존하지 않는다. (R-17)
        dictionaryVersion:
          type: string
          description: 질의 사전 버전. `<버전 이름>@<사전 내용 해시 12자리>`다. (R-29)
          pattern: '^v[0-9]+@[0-9a-f]{12}$'
        promptVersion:
          type: [string, 'null']
          description: '`parseMethod`가 `llm`일 때만 `query_parse` 프롬프트 버전 ID, 아니면 null (R-11, R-19)'
          pattern: '^[a-z_]+@[0-9a-f]{12}$'
        taxonomyVersion:
          type: string
          description: 질의 사전과 `query_parse` 출력 스키마가 참조하는 분류 체계 버전(`service-contracts/taxonomy/<버전>/`) (R-30)
          pattern: '^v[0-9]+$'
        canonicalQuery:
          type: string
          minLength: 1
          description: |
            표준 질의 문자열. route·대상어·이벤트 유형·해석 방법·사전 버전·분류 체계 버전(`llm`이면 프롬프트 버전 포함)이 같으면 같은 값이고 하나라도 다르면 다른 값이다. (R-18)
            호출자는 이 문자열을 해석하지 않고 그대로 재사용 키의 일부로 쓴다. 형식은 바뀔 수 있다.
    TaskType:
      type: string
      description: |
        분석 작업 유형. 다른 taskType은 각 기능 spec에서 추가한다.
        값은 늘어날 수 있는 열린 목록(`x-extensible-enum`)이다. 쓰는 쪽은 모르는 값을 받아도 실패하지 않아야 한다. 등록되지 않은 값을 요청하면 400 `AI_UNKNOWN_TASK_TYPE`이다. (ADR-0014)
        - `event_judge`: 이벤트 후보 판정 → `VLMAnalysis` (SPEC-009)
        - `event_judge_escalate`: 위험하거나 판단 불가인 후보를 더 강한 모델로 재판정. 입력·출력 형식은 `event_judge`와 같고 모델은 프로필에서 따로 정한다. 재판정할지는 호출자(event-analyzer)가 정한다. (SPEC-020 R-20)
        - `track_attribute`: 트랙 대표 크롭 1~3장 → 보호구·역할·장비·외형 설명(`events/_track-attribute.schema.json`) (SPEC-024)
        - `object_question`: 트랙 크롭과 장면 프레임, 질문 → 답(`events/_object-answer.schema.json`) (SPEC-024)
        - `source_summary`: 영상 하나의 타임라인·위험 상태 JSON(이미지 없음) → 근거만으로 쓴 요약과 중요 순간(`events/_source-summary.schema.json`). 호출자는 aggregator다. (SPEC-027)
        - `state_compare`: 같은 자리의 전후 프레임 2장, 기대 객체 목록 → VLMAnalysis와 변화 목록(`events/_state-compare.schema.json`). 호출자는 aggregator 재고 비교다. (SPEC-028)
        - `risk_forecast`: 활성 위험의 특징 값(이미지 없음) → 다음 구간 노출 확률(`events/_risk-forecast.schema.json`). VLM이 아니라 predictor Adapter가 처리하고 1단계는 규칙 점수다. (SPEC-028)
      x-extensible-enum: [event_judge, event_judge_escalate, track_attribute, object_question, source_summary, state_compare, risk_forecast]
    EmbedTaskType:
      type: string
      description: |
        벡터 종류. (SPEC-011)
        값은 늘어날 수 있는 열린 목록(`x-extensible-enum`)이다. 쓰는 쪽은 모르는 값을 받아도 실패하지 않아야 한다. 등록되지 않은 값을 요청하면 400 `AI_UNKNOWN_TASK_TYPE`이다. (ADR-0014)
        - `embed_visual_text`: 영어 검색 문장 → 이미지·질의 인코더의 텍스트 벡터. `texts`를 쓴다.
        - `embed_image`: 검색용 이미지 → 같은 인코더의 이미지 벡터. `images`를 쓴다.
        - `embed_text`: 문장(한국어 포함) → 텍스트 임베딩 벡터. `texts`를 쓴다.
      x-extensible-enum: [embed_visual_text, embed_image, embed_text]
    EmbedRequest:
      type: object
      additionalProperties: false
      required: [taskType]
      description: taskType에 따라 `texts`와 `images` 중 하나만 보낸다. 다른 쪽을 보내거나 둘 다 없으면 `AI_INVALID_REQUEST`다. (SPEC-011 R-7)
      properties:
        taskType:
          $ref: '#/components/schemas/EmbedTaskType'
        texts:
          type: array
          minItems: 1
          description: 벡터로 바꿀 문장. 최대 개수와 문장 길이 상한은 taskType별 설정이다. (R-8, R-26)
          items:
            type: string
            minLength: 1
        images:
          type: array
          minItems: 1
          description: 벡터로 바꿀 이미지. 최대 개수는 taskType별 설정이다. (R-8, R-10)
          items:
            $ref: '#/components/schemas/EmbedImageRef'
    EmbedImageRef:
      type: object
      additionalProperties: false
      required: [storageKey]
      properties:
        storageKey:
          type: string
          minLength: 1
          maxLength: 1024
          description: 저장소 객체 키. taskType별 허용 패턴(설정)에 맞아야 한다. 검색용 이미지는 질의 전용 폴더 경로다. (R-10)
    EmbedResponse:
      type: object
      required: [callId, taskType, modelId, dimension, vectors]
      properties:
        callId:
          type: string
          format: uuid
          description: 호출 ID. 호출 로그를 찾는 키다. (SPEC-011 R-23)
        taskType:
          $ref: '#/components/schemas/EmbedTaskType'
        modelId:
          type: string
          description: 벡터를 만든 모델 ID(프로필 값). 저장하는 벡터의 `embedding_model`로 쓴다. 인코더 taskType이면 frame-encoder와 같은 문자열이다. (R-6)
        dimension:
          type: integer
          minimum: 1
          description: 벡터 차원(프로필 값)
        vectors:
          type: array
          description: 입력 순서대로 만든 벡터. 각 벡터는 길이(L2 노름) 1이다. (R-4)
          items:
            type: array
            items:
              type: number
    AnalyzeRequest:
      type: object
      additionalProperties: false
      required: [taskType, sourceId, images, variables]
      properties:
        taskType:
          $ref: '#/components/schemas/TaskType'
        sourceId:
          type: string
          format: uuid
          description: 분석하는 영상 ID. 이미지 경로는 모두 `sources/<sourceId>/` 아래여야 하고, 호출 로그를 이 ID로 남겨 영상 삭제 때 원문을 지운다. (SPEC-009 R-10, R-20)
        images:
          type: array
          description: 모델에 보낼 이미지. 순서대로 모델에 전달한다. 최대 개수는 taskType별 설정이다. (R-4)
          items:
            $ref: '#/components/schemas/ImageRef'
        variables:
          type: object
          description: taskType의 입력 변수. 형식은 ai 레포 `services/ai-gateway/registry/prompts/<taskType>/input.schema.json`이다. (R-2)
    ImageRef:
      type: object
      additionalProperties: false
      required: [storageKey]
      properties:
        storageKey:
          type: string
          minLength: 1
          maxLength: 1024
          description: 저장소 객체 키. 허용 패턴(설정)에 맞는 블러 사본 경로만 받는다. (R-9)
        ptsSec:
          type: [number, 'null']
          minimum: 0
          description: 이 프레임의 정규화 사본 기준 시각(초). 모르면 null
    AnalyzeResponse:
      type: object
      required: [callId, taskType, modelId, promptVersion, taxonomyVersion, output]
      properties:
        callId:
          type: string
          format: uuid
          description: 호출 ID. 호출 로그와 모델 원문을 찾는 키다. (SPEC-009 R-1, R-17)
        taskType:
          $ref: '#/components/schemas/TaskType'
        modelId:
          type: [string, 'null']
          description: 호출한 모델 이름(프로필 값). 모델 미설정이면 null (R-8)
        promptVersion:
          type: string
          description: 프롬프트 버전 ID. `<taskType>@<내용 해시 12자리>`이며 고정 접두부·프롬프트·입력·출력 스키마·분류 체계 내용으로 계산한다. (R-13)
          pattern: '^[a-z_]+@[0-9a-f]{12}$'
        taxonomyVersion:
          type: [string, 'null']
          description: 이 taskType의 입력·출력 스키마가 참조하는 분류 체계 버전(`service-contracts/taxonomy/<버전>/`). 참조하지 않으면 null (R-29)
          pattern: '^v[0-9]+$'
        output:
          type: object
          description: 검증된 결과. 형식은 ai 레포 `services/ai-gateway/registry/prompts/<taskType>/output.schema.json`이다. `event_judge`·`event_judge_escalate`는 VLMAnalysis이고 원본은 `events/_vlm-analysis.schema.json`이다(ADR-0012, SPEC-020). (R-5~R-8)
