openapi: 3.1.0
info:
  title: quality-service API
  version: 3.0.0
  description: '검토 큐, Golden Set 버전, 평가 실행과 CI Gate, 처리 단계 리포트 (SPEC-029). 외부 데이터셋 가져오기, 특징 내보내기, 처리 단계 성능 Gate (SPEC-030).

    - `/api/v1/quality/**`는 api-gateway를 거치고 OPERATOR 역할만 쓴다. 역할 검사는 서비스가 `X-User-Roles`로 한다.

    - `/internal/v1/quality/**`는 평가 잡 전용이다. api-gateway가 라우팅하지 않고 NetworkPolicy와 호출자 헤더 허용 목록으로 막는다.

    '
servers:
- url: /
  description: api-gateway 경유(내부 경로는 클러스터 내부 주소 http://quality-service:8088)
tags:
- name: review
  description: 검토 큐
- name: golden-sets
  description: Golden Set
- name: evaluation
  description: 평가 실행과 CI Gate
- name: stage-reports
  description: 처리 단계 리포트
- name: internal
  description: 클러스터 내부 전용
- name: datasets
  description: 외부 데이터셋 가져오기
- name: exports
  description: 특징 내보내기
- name: alert-reports
  description: 실시간 긴급 알림 지표 (SPEC-029 R-28, v5.1)
paths:
  /api/v1/quality/review-items:
    get:
      operationId: listReviewItems
      summary: 검토 큐 목록
      description: 상태·사유·유형으로 거른 검토 항목. 정렬은 createdAt 오름차순, itemId 순 (SPEC-029 R-5)
      tags:
      - review
      parameters:
      - $ref: ./_common.yaml#/components/parameters/XUserId
      - $ref: ./_common.yaml#/components/parameters/XUserRoles
      - $ref: '#/components/parameters/ReviewStatus'
      - $ref: '#/components/parameters/ReviewReason'
      - $ref: '#/components/parameters/EventType'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 검토 항목 한 쪽
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - page
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReviewItem'
                  page:
                    $ref: ./_common.yaml#/components/schemas/PageMeta
              example:
                items:
                - itemId: 0192fa00-0000-5000-8000-000000000001
                  eventId: 0192f300-0000-5000-8000-000000000101
                  sourceId: 0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                  jobId: 0192f0d5-0000-7000-8000-000000000001
                  eventType: ppe_missing
                  startMs: 95000
                  endMs: 105000
                  judgmentMethod: rule+vlm+escalate
                  reason: review_required
                  reviewReasons:
                  - judgments_disagree
                  evidenceFrameKeys:
                  - sources/0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f/jobs/0192f0d5-0000-7000-8000-000000000001/chunks/0192f0d6-0000-7000-8000-000000000001/executions/0192f0d7-0000-7000-8000-000000000001/blurred/ev-1.jpg
                  analysis:
                    eventType: ppe_missing
                    eventDetected: true
                    verificationStatus: confirmed
                    description: 크레인 하부에서 작업자가 안전모 없이 자재를 옮깁니다.
                    beforeState: null
                    afterState: 안전모 미착용 작업자 작업 중
                    riskDetected: true
                    riskType: ppe_missing
                    riskReason: 안전모 미착용
                    solution: 안전관리자 확인 필요
                    severity: high
                    evidenceStart: 95.0
                    evidenceEnd: 100.0
                  status: LABELED
                  assigneeId: 0192f0c4-6d1e-7a3b-9c2d-1e2f3a4b5c6d
                  assignedAt: '2026-11-06T10:00:00Z'
                  label:
                    verdict: incorrect
                    eventPresent: true
                    eventType: ppe_missing
                    startMs: 96000
                    endMs: 104000
                    severity: medium
                    note: 안전모는 썼고 조끼만 없음
                  labeledAt: '2026-11-06T10:05:00Z'
                  createdAt: '2026-11-06T09:00:00Z'
                  evidenceFrameUrls:
                  - https://storage.example/vlm/...signed
                page:
                  page: 0
                  size: 20
                  totalElements: 1
                  totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: ./_common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/quality/review-items/{itemId}:
    get:
      operationId: getReviewItem
      summary: 검토 항목 상세
      description: 근거 프레임 경로·판정 결과·라벨을 담는다 (SPEC-029 R-5)
      tags:
      - review
      parameters:
      - $ref: ./_common.yaml#/components/parameters/XUserId
      - $ref: ./_common.yaml#/components/parameters/XUserRoles
      - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: 검토 항목
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewItem'
              example:
                itemId: 0192fa00-0000-5000-8000-000000000001
                eventId: 0192f300-0000-5000-8000-000000000101
                sourceId: 0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                jobId: 0192f0d5-0000-7000-8000-000000000001
                eventType: ppe_missing
                startMs: 95000
                endMs: 105000
                judgmentMethod: rule+vlm+escalate
                reason: review_required
                reviewReasons:
                - judgments_disagree
                evidenceFrameKeys:
                - sources/0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f/jobs/0192f0d5-0000-7000-8000-000000000001/chunks/0192f0d6-0000-7000-8000-000000000001/executions/0192f0d7-0000-7000-8000-000000000001/blurred/ev-1.jpg
                analysis:
                  eventType: ppe_missing
                  eventDetected: true
                  verificationStatus: confirmed
                  description: 크레인 하부에서 작업자가 안전모 없이 자재를 옮깁니다.
                  beforeState: null
                  afterState: 안전모 미착용 작업자 작업 중
                  riskDetected: true
                  riskType: ppe_missing
                  riskReason: 안전모 미착용
                  solution: 안전관리자 확인 필요
                  severity: high
                  evidenceStart: 95.0
                  evidenceEnd: 100.0
                status: LABELED
                assigneeId: 0192f0c4-6d1e-7a3b-9c2d-1e2f3a4b5c6d
                assignedAt: '2026-11-06T10:00:00Z'
                label:
                  verdict: incorrect
                  eventPresent: true
                  eventType: ppe_missing
                  startMs: 96000
                  endMs: 104000
                  severity: medium
                  note: 안전모는 썼고 조끼만 없음
                labeledAt: '2026-11-06T10:05:00Z'
                createdAt: '2026-11-06T09:00:00Z'
                evidenceFrameUrls:
                - https://storage.example/vlm/...signed
        '404':
          $ref: '#/components/responses/ReviewNotFound'
        '401':
          $ref: ./_common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/quality/review-items/{itemId}/assignment:
    post:
      operationId: assignReviewItem
      summary: 검토 항목 맡기
      description: '`UNASSIGNED`인 항목을 요청자에게 맡긴다. 동시에 여러 명이 요청하면 한 명만 성공하고 나머지는 409 `QUALITY_REVIEW_ALREADY_ASSIGNED`다 (SPEC-029 R-6)'
      tags:
      - review
      parameters:
      - $ref: ./_common.yaml#/components/parameters/XUserId
      - $ref: ./_common.yaml#/components/parameters/XUserRoles
      - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: 맡은 항목
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewItem'
              example:
                itemId: 0192fa00-0000-5000-8000-000000000001
                eventId: 0192f300-0000-5000-8000-000000000101
                sourceId: 0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                jobId: 0192f0d5-0000-7000-8000-000000000001
                eventType: ppe_missing
                startMs: 95000
                endMs: 105000
                judgmentMethod: rule+vlm+escalate
                reason: review_required
                reviewReasons:
                - judgments_disagree
                evidenceFrameKeys:
                - sources/0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f/jobs/0192f0d5-0000-7000-8000-000000000001/chunks/0192f0d6-0000-7000-8000-000000000001/executions/0192f0d7-0000-7000-8000-000000000001/blurred/ev-1.jpg
                analysis:
                  eventType: ppe_missing
                  eventDetected: true
                  verificationStatus: confirmed
                  description: 크레인 하부에서 작업자가 안전모 없이 자재를 옮깁니다.
                  beforeState: null
                  afterState: 안전모 미착용 작업자 작업 중
                  riskDetected: true
                  riskType: ppe_missing
                  riskReason: 안전모 미착용
                  solution: 안전관리자 확인 필요
                  severity: high
                  evidenceStart: 95.0
                  evidenceEnd: 100.0
                status: ASSIGNED
                assigneeId: 0192f0c4-6d1e-7a3b-9c2d-1e2f3a4b5c6d
                assignedAt: '2026-11-06T10:00:00Z'
                label: null
                labeledAt: null
                createdAt: '2026-11-06T09:00:00Z'
                evidenceFrameUrls:
                - https://storage.example/vlm/...signed
        '404':
          $ref: '#/components/responses/ReviewNotFound'
        '409':
          description: 이미 다른 사람이 맡았거나 라벨이 끝남 (`QUALITY_REVIEW_ALREADY_ASSIGNED`, `QUALITY_REVIEW_ALREADY_LABELED`)
          content:
            application/problem+json:
              schema:
                $ref: ./_common.yaml#/components/schemas/ProblemDetail
              example:
                type: about:blank
                title: Conflict
                status: 409
                code: QUALITY_REVIEW_ALREADY_ASSIGNED
        '401':
          $ref: ./_common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: releaseReviewItem
      summary: 검토 항목 내려놓기
      description: 맡은 사람만 `ASSIGNED → UNASSIGNED`로 되돌린다 (SPEC-029 R-7)
      tags:
      - review
      parameters:
      - $ref: ./_common.yaml#/components/parameters/XUserId
      - $ref: ./_common.yaml#/components/parameters/XUserRoles
      - $ref: '#/components/parameters/ItemId'
      responses:
        '204':
          description: 내려놓음
        '404':
          $ref: '#/components/responses/ReviewNotFound'
        '409':
          description: 맡은 상태가 아님 (`QUALITY_REVIEW_NOT_ASSIGNED`)
          content:
            application/problem+json:
              schema:
                $ref: ./_common.yaml#/components/schemas/ProblemDetail
              example:
                type: about:blank
                title: Conflict
                status: 409
                code: QUALITY_REVIEW_NOT_ASSIGNED
        '401':
          $ref: ./_common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/quality/review-items/{itemId}/label:
    put:
      operationId: labelReviewItem
      summary: 검토 라벨 저장
      description: 맡은 사람만 라벨을 저장한다. 저장하면 `LABELED`가 되고, 같은 사람이 다시 저장하면 덮어쓴다 (SPEC-029 R-8~R-10)
      tags:
      - review
      parameters:
      - $ref: ./_common.yaml#/components/parameters/XUserId
      - $ref: ./_common.yaml#/components/parameters/XUserRoles
      - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewLabel'
            example:
              verdict: incorrect
              eventPresent: true
              eventType: ppe_missing
              startMs: 96000
              endMs: 104000
              severity: medium
              note: 안전모는 썼고 조끼만 없음
      responses:
        '200':
          description: 라벨을 저장한 항목
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewItem'
              example:
                itemId: 0192fa00-0000-5000-8000-000000000001
                eventId: 0192f300-0000-5000-8000-000000000101
                sourceId: 0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                jobId: 0192f0d5-0000-7000-8000-000000000001
                eventType: ppe_missing
                startMs: 95000
                endMs: 105000
                judgmentMethod: rule+vlm+escalate
                reason: review_required
                reviewReasons:
                - judgments_disagree
                evidenceFrameKeys:
                - sources/0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f/jobs/0192f0d5-0000-7000-8000-000000000001/chunks/0192f0d6-0000-7000-8000-000000000001/executions/0192f0d7-0000-7000-8000-000000000001/blurred/ev-1.jpg
                analysis:
                  eventType: ppe_missing
                  eventDetected: true
                  verificationStatus: confirmed
                  description: 크레인 하부에서 작업자가 안전모 없이 자재를 옮깁니다.
                  beforeState: null
                  afterState: 안전모 미착용 작업자 작업 중
                  riskDetected: true
                  riskType: ppe_missing
                  riskReason: 안전모 미착용
                  solution: 안전관리자 확인 필요
                  severity: high
                  evidenceStart: 95.0
                  evidenceEnd: 100.0
                status: LABELED
                assigneeId: 0192f0c4-6d1e-7a3b-9c2d-1e2f3a4b5c6d
                assignedAt: '2026-11-06T10:00:00Z'
                label:
                  verdict: incorrect
                  eventPresent: true
                  eventType: ppe_missing
                  startMs: 96000
                  endMs: 104000
                  severity: medium
                  note: 안전모는 썼고 조끼만 없음
                labeledAt: '2026-11-06T10:05:00Z'
                createdAt: '2026-11-06T09:00:00Z'
                evidenceFrameUrls:
                - https://storage.example/vlm/...signed
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ReviewNotFound'
        '409':
          description: 맡은 상태가 아님 (`QUALITY_REVIEW_NOT_ASSIGNED`)
          content:
            application/problem+json:
              schema:
                $ref: ./_common.yaml#/components/schemas/ProblemDetail
              example:
                type: about:blank
                title: Conflict
                status: 409
                code: QUALITY_REVIEW_NOT_ASSIGNED
        '401':
          $ref: ./_common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/quality/golden-sets:
    post:
      operationId: createGoldenSet
      summary: Golden Set 만들기
      description: 이름은 전체에서 유일하다. 개발(dev)·평가(eval) 분할은 바꿀 수 없다 (SPEC-029 R-11)
      tags:
      - golden-sets
      parameters:
      - $ref: ./_common.yaml#/components/parameters/XUserId
      - $ref: ./_common.yaml#/components/parameters/XUserRoles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoldenSetRequest'
            example:
              name: ppe-eval
              split: eval
              description: 보호구 평가 세트
      responses:
        '201':
          description: 만든 Golden Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoldenSet'
              example:
                setId: 0192fb00-0000-7000-8000-000000000001
                name: ppe-eval
                split: eval
                description: 보호구 평가 세트
                draftEntryCount: 0
                latestVersion: null
                baselineRunId: null
                createdAt: '2026-11-06T09:00:00Z'
                origin: review
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 같은 이름이 있음 (`QUALITY_GOLDEN_SET_DUPLICATED`)
          content:
            application/problem+json:
              schema:
                $ref: ./_common.yaml#/components/schemas/ProblemDetail
              example:
                type: about:blank
                title: Conflict
                status: 409
                code: QUALITY_GOLDEN_SET_DUPLICATED
        '401':
          $ref: ./_common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      operationId: listGoldenSets
      summary: Golden Set 목록
      description: 이름 순
      tags:
      - golden-sets
      parameters:
      - $ref: ./_common.yaml#/components/parameters/XUserId
      - $ref: ./_common.yaml#/components/parameters/XUserRoles
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Golden Set 한 쪽
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - page
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/GoldenSet'
                  page:
                    $ref: ./_common.yaml#/components/schemas/PageMeta
              example:
                items:
                - setId: 0192fb00-0000-7000-8000-000000000001
                  name: ppe-eval
                  split: eval
                  description: 보호구 평가 세트
                  draftEntryCount: 12
                  latestVersion: 2
                  baselineRunId: 0192fc00-0000-7000-8000-000000000001
                  createdAt: '2026-11-06T09:00:00Z'
                  origin: review
                page:
                  page: 0
                  size: 20
                  totalElements: 1
                  totalPages: 1
        '401':
          $ref: ./_common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/quality/golden-sets/{setId}:
    get:
      operationId: getGoldenSet
      summary: Golden Set 상세
      description: 초안 항목 수, 최신 확정 버전, 기준 평가 실행 (SPEC-029 R-11)
      tags:
      - golden-sets
      parameters:
      - $ref: ./_common.yaml#/components/parameters/XUserId
      - $ref: ./_common.yaml#/components/parameters/XUserRoles
      - $ref: '#/components/parameters/SetId'
      responses:
        '200':
          description: Golden Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoldenSet'
              example:
                setId: 0192fb00-0000-7000-8000-000000000001
                name: ppe-eval
                split: eval
                description: 보호구 평가 세트
                draftEntryCount: 12
                latestVersion: 2
                baselineRunId: 0192fc00-0000-7000-8000-000000000001
                createdAt: '2026-11-06T09:00:00Z'
                origin: review
        '404':
          $ref: '#/components/responses/GoldenNotFound'
        '401':
          $ref: ./_common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/quality/golden-sets/{setId}/entries:
    post:
      operationId: addGoldenSetEntry
      summary: 검토 라벨을 초안에 넣기
      description: '`LABELED`이고 verdict가 uncertain이 아닌 검토 항목만 넣는다. 같은 항목은 한 번만 들어간다 (SPEC-029 R-12, R-13)'
      tags:
      - golden-sets
      parameters:
      - $ref: ./_common.yaml#/components/parameters/XUserId
      - $ref: ./_common.yaml#/components/parameters/XUserRoles
      - $ref: '#/components/parameters/SetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddGoldenSetEntryRequest'
            example:
              reviewItemId: 0192fa00-0000-5000-8000-000000000001
      responses:
        '201':
          description: 넣은 초안 항목
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoldenSetEntry'
              example:
                entryId: 0192fb10-0000-7000-8000-000000000001
                setId: 0192fb00-0000-7000-8000-000000000001
                reviewItemId: 0192fa00-0000-5000-8000-000000000001
                sourceId: 0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                eventId: 0192f300-0000-5000-8000-000000000101
                label:
                  verdict: incorrect
                  eventPresent: true
                  eventType: ppe_missing
                  startMs: 96000
                  endMs: 104000
                  severity: medium
                  note: 안전모는 썼고 조끼만 없음
                addedAt: '2026-11-06T10:10:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/GoldenNotFound'
        '409':
          description: 라벨이 없거나 uncertain이거나 이미 들어 있거나 데이터셋 Golden Set임 (`QUALITY_REVIEW_NOT_LABELED`, `QUALITY_GOLDEN_ENTRY_DUPLICATED`, `QUALITY_GOLDEN_ORIGIN_MISMATCH`)
          content:
            application/problem+json:
              schema:
                $ref: ./_common.yaml#/components/schemas/ProblemDetail
              example:
                type: about:blank
                title: Conflict
                status: 409
                code: QUALITY_REVIEW_NOT_LABELED
        '401':
          $ref: ./_common.yaml#/components/responses/Unauthenticated
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      operationId: listGoldenSetEntries
      summary: 초안 항목 목록
      description: 확정하지 않은 초안 항목. 추가 순
      tags:
      - golden-sets
      parameters:
