    CreateDatasetImportRequest:
      type: object
      additionalProperties: false
      required:
      - manifestKey
      properties:
        manifestKey:
          type: string
          pattern: ^imports/[A-Za-z0-9._-]{1,100}/manifest[.]json$
          description: 가져오기 버킷의 매니페스트 경로
        evalRatio:
          type: number
          minimum: 0
          maximum: 1
          default: 0.2
        splitSeed:
          type: integer
          minimum: 0
          default: 0
    DatasetImport:
      type: object
      additionalProperties: false
      required:
      - importId
      - datasetName
      - manifestKey
      - evalRatio
      - splitSeed
      - status
      - counts
      - goldenSets
      - errors
      - requestedBy
      - createdAt
      - finishedAt
      properties:
        importId:
          type: string
          format: uuid
        datasetName:
          type:
          - string
          - 'null'
          description: 매니페스트를 읽기 전에는 null
        manifestKey:
          type: string
        evalRatio:
          type: number
        splitSeed:
          type: integer
        status:
          type: string
          enum:
          - PENDING
          - VALIDATING
          - REGISTERING
          - COMPLETED
          - FAILED
          description: FAILED는 매니페스트 자체가 잘못됐거나 등록된 영상이 하나도 없을 때. 일부 영상 실패는 COMPLETED와 errors
        counts:
          type: object
          additionalProperties: false
          required:
          - videos
          - registered
          - failed
          - labels
          - dev
          - eval
          properties:
            videos:
              type: integer
              minimum: 0
            registered:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
            labels:
              type: integer
              minimum: 0
            dev:
              type: integer
              minimum: 0
            eval:
              type: integer
              minimum: 0
        goldenSets:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - devSetId
          - evalSetId
          - devVersion
          - evalVersion
          properties:
            devSetId:
              type: string
              format: uuid
            evalSetId:
              type: string
              format: uuid
            devVersion:
              type:
              - integer
              - 'null'
            evalVersion:
              type:
              - integer
              - 'null'
        errors:
          type: array
          maxItems: 100
          description: 처음 100건
          items:
            type: object
            additionalProperties: false
            required:
            - externalId
            - code
            - message
            properties:
              externalId:
                type:
                - string
                - 'null'
              code:
                type: string
              message:
                type: string
                maxLength: 500
        requestedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
    CreateFeatureExportRequest:
      type: object
      additionalProperties: false
      description: goldenSetId 또는 from·to 중 하나만
      properties:
        goldenSetId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
    FeatureExport:
      type: object
      additionalProperties: false
      required:
      - exportId
      - status
      - goldenSetId
      - from
      - to
      - fileKey
      - rowCount
      - sourceCount
      - createdAt
      - finishedAt
      properties:
        exportId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - COMPLETED
          - FAILED
        goldenSetId:
          type:
          - string
          - 'null'
          format: uuid
        from:
          type:
          - string
          - 'null'
          format: date
        to:
          type:
          - string
          - 'null'
          format: date
        fileKey:
          type:
          - string
          - 'null'
          pattern: ^exports/[0-9a-f-]{36}/features[.]jsonl$
          description: 한 줄이 `quality/v1/feature-row.schema.json`인 JSON Lines
        rowCount:
          type: integer
          minimum: 0
        sourceCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
    StageGateRequest:
      type: object
      additionalProperties: false
      required:
      - baselineSourceIds
      - candidateSourceIds
      properties:
        baselineSourceIds:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: 기준 벤치마크 실행으로 처리한 영상
        candidateSourceIds:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            format: uuid
        stageIds:
          type: array
          maxItems: 200
          items:
            $ref: ../stages/v1/stages.schema.json#/$defs/stageId
          description: 없으면 양쪽에 기록이 있는 모든 단계
        maxRegressionRatio:
          type: number
          exclusiveMinimum: 0
          maximum: 10
          default: 0.2
          description: 후보 p95 / 기준 p95 − 1이 이 값을 넘으면 실패
        minSamples:
          type: integer
          minimum: 1
          maximum: 1000
          default: 5
    StageGateResult:
      type: object
      additionalProperties: false
      required:
      - passed
      - maxRegressionRatio
      - stages
      properties:
        passed:
          type: boolean
          description: failed인 단계가 없으면 true
        maxRegressionRatio:
          type: number
        stages:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - stageId
            - baselineP95Ms
            - candidateP95Ms
            - ratio
            - baselineCount
            - candidateCount
            - status
            properties:
              stageId:
                type: string
              baselineP95Ms:
                type:
                - number
                - 'null'
              candidateP95Ms:
                type:
                - number
                - 'null'
              ratio:
                type:
                - number
                - 'null'
                description: 후보 p95 / 기준 p95
              baselineCount:
                type: integer
                minimum: 0
              candidateCount:
                type: integer
                minimum: 0
              status:
                type: string
                enum:
                - passed
                - failed
                - skipped
                description: 'skipped: 어느 한쪽 기록 수가 minSamples보다 적음'
