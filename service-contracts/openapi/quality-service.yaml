  /internal/v1/quality/stage-gates:
    post:
      operationId: evaluateStageGate
      summary: 처리 단계 성능 Gate 계산 (내부 전용)
      description: 두 벤치마크 실행의 영상 목록으로 단계별 p95를 비교한다. 원본 보존 기간(90일) 안의 기록만 쓴다. 저장하지 않는 계산 요청이다 (SPEC-030 R-16~R-18)
      tags:
      - internal
      parameters:
      - $ref: '#/components/parameters/XCaller'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageGateRequest'
            example:
              baselineSourceIds:
              - 0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f
              candidateSourceIds:
              - 0192f0d2-0000-7000-8000-0000000000bb
              maxRegressionRatio: 0.2
              minSamples: 5
      responses:
        '200':
          description: 단계별 비교
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageGateResult'
              example:
                passed: false
                maxRegressionRatio: 0.2
                stages:
                - stageId: analyzer.judge
                  baselineP95Ms: 3400.0
                  candidateP95Ms: 4300.0
                  ratio: 1.265
                  baselineCount: 30
                  candidateCount: 31
                  status: failed
                - stageId: normalize.transcode
                  baselineP95Ms: 8000.0
                  candidateP95Ms: null
                  ratio: null
                  baselineCount: 3
                  candidateCount: 0
                  status: skipped
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: 허용 호출자가 아님 (`QUALITY_CALLER_NOT_ALLOWED`)
          content:
            application/problem+json:
              schema:
                $ref: ./_common.yaml#/components/schemas/ProblemDetail
              example:
                type: about:blank
                title: Forbidden
                status: 403
                code: QUALITY_CALLER_NOT_ALLOWED
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ItemId:
      name: itemId
      in: path
      required: true
      description: 검토 항목 ID(eventId로 결정적)
      schema:
        type: string
        format: uuid
    SetId:
      name: setId
      in: path
      required: true
      description: Golden Set ID
      schema:
        type: string
        format: uuid
    EntryId:
      name: entryId
      in: path
      required: true
      description: 초안 항목 ID
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      description: 평가 실행 ID
      schema:
        type: string
        format: uuid
    SourceId:
      name: sourceId
      in: path
      required: true
      description: 영상 ID
      schema:
        type: string
        format: uuid
    ReviewStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
        - UNASSIGNED
        - ASSIGNED
        - LABELED
    ReviewReason:
      name: reason
      in: query
      required: false
      schema:
        type: string
        enum:
        - review_required
        - sample
        - budget_exceeded
        - call_cap_reached
        - model_unavailable
        - alert_dismissed
    EventType:
      name: eventType
      in: query
      required: false
      schema:
        $ref: ../taxonomy/v2/taxonomy.schema.json#/$defs/eventType
    GoldenSetIdQuery:
      name: goldenSetId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    StageIdQuery:
      name: stageId
      in: query
      required: true
      schema:
        $ref: ../stages/v1/stages.schema.json#/$defs/stageId
    From:
      name: from
      in: query
      required: true
      description: 포함, UTC 날짜
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      required: true
      description: 포함, UTC 날짜. from부터 최대 90일
      schema:
        type: string
        format: date
    VersionKey:
      name: versionKey
      in: query
      required: false
      description: StageTiming.versions의 키
      schema:
        type: string
        enum:
        - taxonomy
        - detectorProfile
        - embeddingModel
        - modelId
        - promptVersion
        - analysisVersion
    VersionValue:
      name: versionValue
      in: query
      required: false
      description: versionKey와 함께만
      schema:
        type: string
        maxLength: 200
    Page:
      name: page
      in: query
      required: false
      description: 0부터 시작하는 페이지 번호
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: 페이지 크기
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    XCaller:
      name: X-Caller
      in: header
      required: true
      description: 호출하는 잡 이름. 허용 목록(설정)에 있어야 한다
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{1,62}$
      example: quality-eval
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 요청 형식이 잘못됨 (`QUALITY_INVALID_REQUEST`)
      content:
        application/problem+json:
          schema:
            $ref: ./_common.yaml#/components/schemas/ProblemDetail
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: QUALITY_INVALID_REQUEST
    Forbidden:
      description: OPERATOR 역할이 아님 (`QUALITY_FORBIDDEN`). 검토 항목을 맡은 사람이 아니면 `QUALITY_REVIEW_NOT_ASSIGNEE`
      content:
        application/problem+json:
          schema:
            $ref: ./_common.yaml#/components/schemas/ProblemDetail
          example:
            type: about:blank
            title: Forbidden
            status: 403
            code: QUALITY_FORBIDDEN
    ReviewNotFound:
      description: 검토 항목이 없음 (`QUALITY_REVIEW_NOT_FOUND`)
      content:
        application/problem+json:
          schema:
            $ref: ./_common.yaml#/components/schemas/ProblemDetail
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: QUALITY_REVIEW_NOT_FOUND
    GoldenNotFound:
      description: Golden Set이나 항목이 없음 (`QUALITY_GOLDEN_SET_NOT_FOUND`, `QUALITY_GOLDEN_ENTRY_NOT_FOUND`)
      content:
        application/problem+json:
          schema:
            $ref: ./_common.yaml#/components/schemas/ProblemDetail
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: QUALITY_GOLDEN_SET_NOT_FOUND
    RunNotFound:
      description: 평가 실행이 없음 (`QUALITY_RUN_NOT_FOUND`)
      content:
        application/problem+json:
          schema:
            $ref: ./_common.yaml#/components/schemas/ProblemDetail
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: QUALITY_RUN_NOT_FOUND
    SourceNotFound:
      description: 그 영상의 측정 기록이 없음 (`QUALITY_SOURCE_NOT_FOUND`)
      content:
        application/problem+json:
          schema:
            $ref: ./_common.yaml#/components/schemas/ProblemDetail
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: QUALITY_SOURCE_NOT_FOUND
    ImportNotFound:
      description: 가져오기가 없음 (`QUALITY_IMPORT_NOT_FOUND`)
      content:
        application/problem+json:
          schema:
            $ref: ./_common.yaml#/components/schemas/ProblemDetail
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: QUALITY_IMPORT_NOT_FOUND
    ExportNotFound:
      description: 내보내기가 없음 (`QUALITY_EXPORT_NOT_FOUND`)
      content:
        application/problem+json:
          schema:
            $ref: ./_common.yaml#/components/schemas/ProblemDetail
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: QUALITY_EXPORT_NOT_FOUND
  schemas:
    ReviewLabel:
      type: object
      additionalProperties: false
      required:
      - verdict
      - eventPresent
      - eventType
      - startMs
      - endMs
      - severity
      - note
      description: 검토 라벨. verdict는 판정 결과가 맞았는지, 나머지는 검토자가 본 정답이다
      properties:
        verdict:
          type: string
          enum:
          - correct
          - incorrect
          - uncertain
        eventPresent:
          type: boolean
          description: 그 구간에 이벤트가 실제로 있었는지
        eventType:
          anyOf:
          - $ref: ../taxonomy/v2/taxonomy.schema.json#/$defs/eventType
          - type: 'null'
          description: eventPresent=true면 필수
        startMs:
          type:
          - integer
          - 'null'
          minimum: 0
        endMs:
          type:
          - integer
          - 'null'
          minimum: 0
        severity:
          type:
          - string
          - 'null'
          enum:
          - low
          - medium
          - high
          - null
        note:
          type:
          - string
          - 'null'
          maxLength: 500
    ReviewItem:
      type: object
      additionalProperties: false
      required:
      - itemId
      - eventId
      - sourceId
      - jobId
      - eventType
      - startMs
      - endMs
      - judgmentMethod
      - reason
      - reviewReasons
      - evidenceFrameKeys
      - evidenceFrameUrls
      - analysis
      - status
      - assigneeId
      - assignedAt
      - label
      - labeledAt
      - createdAt
      properties:
        itemId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        eventType:
          $ref: ../taxonomy/v2/taxonomy.schema.json#/$defs/eventType
        startMs:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        endMs:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        judgmentMethod:
          type: string
          maxLength: 50
        reason:
          type: string
          x-extensible-enum:
          - review_required
          - sample
          - budget_exceeded
          - call_cap_reached
          - model_unavailable
          - alert_dismissed
          description: '열린 목록(ADR-0014). review_required: event.analyzed의 reviewRequired, sample: 표본 추출, budget_exceeded·call_cap_reached·model_unavailable: event.analyzed.unverifiedReason(v5.1, SPEC-029 R-27), alert_dismissed: alert.raised dismissed(SPEC-029 R-28)'
        reviewReasons:
          type: array
          items:
            type: string
            maxLength: 100
        evidenceFrameKeys:
          type: array
          items:
            type: string
            maxLength: 1024
          description: 블러 사본 저장소 경로. 화면은 evidenceFrameUrls를 쓴다
        evidenceFrameUrls:
          type: array
          items:
            type: string
            format: uri
          description: evidenceFrameKeys와 같은 순서의 서명 주소(1시간). 화면 표시용이고 로그·저장소에 남기지 않는다 (SPEC-035 R-4)
        analysis:
          type:
          - object
          - 'null'
          description: 판정 결과 VLMAnalysis. 형식은 `events/_vlm-analysis.schema.json`이다. 판정 결과가 없는 항목(사유 `alert_dismissed`의 미판정 알림 등)은 null이다
        status:
          type: string
          enum:
          - UNASSIGNED
          - ASSIGNED
          - LABELED
        assigneeId:
          type:
          - string
          - 'null'
          format: uuid
        assignedAt:
          type:
          - string
          - 'null'
          format: date-time
        label:
          anyOf:
          - $ref: '#/components/schemas/ReviewLabel'
          - type: 'null'
        labeledAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreateGoldenSetRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - split
      properties:
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        split:
          type: string
          enum:
          - dev
          - eval
        description:
          type:
          - string
          - 'null'
          maxLength: 500
    GoldenSet:
      type: object
      additionalProperties: false
      required:
      - setId
      - name
      - split
      - description
      - draftEntryCount
      - latestVersion
      - baselineRunId
      - createdAt
      - origin
      properties:
        setId:
          type: string
          format: uuid
        name:
          type: string
        split:
          type: string
          enum:
          - dev
          - eval
        description:
          type:
          - string
          - 'null'
        draftEntryCount:
          type: integer
          minimum: 0
        latestVersion:
          type:
          - integer
          - 'null'
          minimum: 1
        baselineRunId:
          type:
          - string
          - 'null'
          format: uuid
        createdAt:
          type: string
          format: date-time
        origin:
          type: string
          enum:
          - review
          - import
          description: 'review: 검토 라벨, import: 외부 데이터셋(SPEC-030)'
    AddGoldenSetEntryRequest:
      type: object
      additionalProperties: false
      required:
      - reviewItemId
      properties:
        reviewItemId:
          type: string
          format: uuid
    GoldenSetEntry:
      type: object
      additionalProperties: false
      required:
      - entryId
      - setId
      - reviewItemId
      - sourceId
      - eventId
      - label
      - addedAt
      properties:
        entryId:
          type: string
          format: uuid
        setId:
          type: string
          format: uuid
        reviewItemId:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        label:
          $ref: '#/components/schemas/ReviewLabel'
        addedAt:
          type: string
          format: date-time
    GoldenSetVersion:
      type: object
      additionalProperties: false
      required:
      - setId
      - version
      - entryCount
      - manifestKey
      - frozenAt
      - frozenBy
      properties:
        setId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        entryCount:
          type: integer
          minimum: 1
        manifestKey:
          type: string
          pattern: ^golden/[0-9a-f-]{36}/v[0-9]+/manifest[.]json$
          description: Golden Set 저장소의 매니페스트(`quality/v1/golden-manifest.schema.json`)
        frozenAt:
          type: string
          format: date-time
        frozenBy:
          type: string
          format: uuid
    SetBaselineRequest:
      type: object
      additionalProperties: false
      required:
      - runId
      properties:
        runId:
          type: string
          format: uuid
    Metric:
      type: object
      additionalProperties: false
      required:
      - name
      - eventType
      - value
      - higherIsBetter
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          description: '예: candidate_recall, judge_precision, temporal_iou_mean, recall_at_50'
        eventType:
          anyOf:
          - $ref: ../taxonomy/v2/taxonomy.schema.json#/$defs/eventType
          - type: 'null'
          description: 유형별 지표면 유형, 전체면 null
        value:
          type: number
        higherIsBetter:
          type: boolean
    RunVersions:
      type: object
      additionalProperties: false
      required:
      - taxonomy
      - detectorProfile
      - modelId
      - promptVersion
      - embeddingModel
