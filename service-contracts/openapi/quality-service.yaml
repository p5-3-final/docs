                type: string
              eventType:
                type:
                - string
                - 'null'
              baseline:
                type: number
              value:
                type:
                - number
                - 'null'
                description: 이번 실행의 값. 기준 실행에만 있는 지표(이번 실행에서 빠짐)면 null이다 (SPEC-029 R-18)
    StageStat:
