          description: 받을 때의 기준 실행. 없으면 null
        passed:
          type:
          - boolean
          - 'null'
          description: 기준이 없으면 null
        tolerance:
          type: number
          minimum: 0
          description: 허용 하락폭(절댓값, 설정)
        failures:
          type: array
