openapi: 3.1.0
info:
  title: analysis-api API
  version: 0.3.0
  description: 'analysis-api의 내부 읽기 전용 API. aggregator가 job 하나의 적재 결과를 한 번 읽는 데 쓴다(SPEC-027).

    다른 담당자 서비스이고, 이 파일은 소비 쪽 spec이 아키텍처 문서대로 먼저 정한 내부 경로만 담는다(생산자 담당자 확인 필요). 공개 API(`/api/v1/analysis/**`)도 화면 spec(SPEC-031·SPEC-032)이 아키텍처 문서 "외부 API" 표대로 먼저 정했다(생산자 담당자 확인 필요). 공개 API는 api-gateway를
    거치고, USER는 자기 영상만, OPERATOR는 모든 영상을 본다. 남의 영상은 404다.

    - api-gateway는 `/internal/**`을 라우팅하지 않는다. 클러스터 안에서 NetworkPolicy와 호출자 헤더 허용 목록으로 막는다.

    - 내부 동기 호출 규약(overview "통신 규칙", SPEC-021): 호출자는 `X-Request-Deadline`을 넣고, 받는 쪽은 남은 시간이 없으면 504 `ANALYSIS_DEADLINE_EXCEEDED`로 답한다. 읽기 전용이라 호출자는 503·연결 실패에 2회 재시도할 수 있다.

    - 목록은 커서 쪽 나누기(cursor pagination)이고 정렬은 고정이다. 같은 job에 같은 커서로 다시 부르면 같은 쪽을 돌려준다.

    '
servers:
- url: /
  description: api-gateway 경유. 내부 경로는 클러스터 내부 주소 http://analysis-api:8085
tags:
- name: internal
  description: 클러스터 내부 전용
- name: events
  description: 이벤트 타임라인·상세·검토 (SPEC-031)
- name: states
  description: 위험 상태·스냅샷·요약 (SPEC-031)
paths:
  /internal/v1/sources/{sourceId}/jobs/{jobId}/events:
    get:
      operationId: listJobEvents
      summary: job의 판정 이벤트 목록 (내부 전용)
      description: 'job에 적재된 이벤트 전체. 판정 상태와 상관없이 모두 돌려준다. trackId는 track.manifest 번역표로 바꾼 최종 ID다. 정렬은 startMs, eventId 순.

        '
      tags:
      - internal
      security: []
      parameters:
      - $ref: '#/components/parameters/SourceId'
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/XCaller'
      - $ref: '#/components/parameters/TraceParent'
      - $ref: '#/components/parameters/XRequestDeadline'
      responses:
        '200':
          description: 한 쪽(page). nextCursor가 null이면 마지막 쪽이다
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobEvent'
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    maxLength: 512
              example:
                items:
                - eventId: 0192f300-0000-5000-8000-000000000101
                  chunkId: 0192f0d6-0000-7000-8000-000000000001
                  eventType: ppe_missing
                  startMs: 95000
                  endMs: 105000
                  trackId: 0192f200-0000-5000-8000-000000000001
                  zoneId: 0192f100-0000-7000-8000-0000000000f1
                  zoneName: A동 크레인 하부
                  judgmentMethod: rule+vlm
                  score: 0.82
                  reviewRequired: false
                  analysis:
                    eventType: ppe_missing
                    eventDetected: true
                    verificationStatus: confirmed
                    description: 크레인 하부에서 작업자가 안전모 없이 자재를 옮깁니다.
                    beforeState: null
                    afterState: 안전모 미착용 작업자 작업 중
                    riskDetected: true
                    riskType: ppe_missing
                    riskReason: 안전모 미착용
                    solution: 안전관리자 확인 필요. 작업 중지 후 안전모 착용
                    severity: medium
                    evidenceStart: 95.0
                    evidenceEnd: 100.0
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/DeadlineExceeded'
  /internal/v1/sources/{sourceId}/jobs/{jobId}/tracks:
    get:
      operationId: listJobTracks
      summary: job의 최종 트랙 목록 (내부 전용)
      description: 'track.manifest 번역표를 적용한 최종 트랙. 정렬은 startMs, trackId 순.

        '
      tags:
      - internal
      security: []
      parameters:
      - $ref: '#/components/parameters/SourceId'
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/XCaller'
      - $ref: '#/components/parameters/TraceParent'
      - $ref: '#/components/parameters/XRequestDeadline'
      responses:
        '200':
          description: 한 쪽(page). nextCursor가 null이면 마지막 쪽이다
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobTrack'
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    maxLength: 512
              example:
                items:
                - trackId: 0192f200-0000-5000-8000-000000000001
                  className: person
                  startMs: 40000
                  endMs: 125000
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/DeadlineExceeded'
  /internal/v1/sources/{sourceId}/jobs/{jobId}/zone-presences:
    get:
      operationId: listJobZonePresences
      summary: job의 트랙별 구역 머문 구간 목록 (내부 전용)
      description: '최종 트랙이 구역 안에 있던 구간. 같은 트랙이 다시 들어오면 구간이 따로 나온다. 정렬은 enterMs, trackId, zoneId 순.

        '
      tags:
      - internal
      security: []
      parameters:
      - $ref: '#/components/parameters/SourceId'
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/XCaller'
      - $ref: '#/components/parameters/TraceParent'
      - $ref: '#/components/parameters/XRequestDeadline'
      responses:
        '200':
          description: 한 쪽(page). nextCursor가 null이면 마지막 쪽이다
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ZonePresence'
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    maxLength: 512
              example:
                items:
                - trackId: 0192f200-0000-5000-8000-000000000001
                  zoneId: 0192f100-0000-7000-8000-0000000000f1
                  enterMs: 60000
                  exitMs: 125000
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/DeadlineExceeded'
  /internal/v1/sources/{sourceId}/zones:
    get:
      operationId: listSourceZones
      summary: 영상의 구역 정의 (내부 전용)
      description: '운영자가 정의한 구역. 구역이 없으면 빈 목록이다.

        '
      tags:
      - internal
      security: []
      parameters:
      - $ref: '#/components/parameters/SourceId'
      - $ref: '#/components/parameters/XCaller'
      - $ref: '#/components/parameters/TraceParent'
      - $ref: '#/components/parameters/XRequestDeadline'
      responses:
        '200':
          description: 구역 목록
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/Zone'
              example:
                items:
                - zoneId: 0192f100-0000-7000-8000-0000000000f1
                  name: A동 크레인 하부
                  kind: hazard
        '404':
          $ref: '#/components/responses/SourceNotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/DeadlineExceeded'
  /internal/v1/sources/{sourceId}/final-state:
    get:
      operationId: getSourceFinalState
      summary: 영상 활성 분석 버전의 마지막 상태 (내부 전용)
      description: '활성 분석 버전의 구역별 마지막 상태와 끝까지 활성인 위험. 작업 세션 다음 영상의 초기 상태로 쓴다(overview "위험 상태와 상태 스냅샷" 작업 세션 행).

        활성 분석 버전이 없으면 404 `ANALYSIS_NO_ACTIVE_VERSION`이다.

        '
      tags:
      - internal
      security: []
      parameters:
      - $ref: '#/components/parameters/SourceId'
      - $ref: '#/components/parameters/XCaller'
      - $ref: '#/components/parameters/TraceParent'
      - $ref: '#/components/parameters/XRequestDeadline'
      responses:
        '200':
          description: 마지막 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalState'
              example:
                sourceId: 0192f0d2-0000-7000-8000-0000000000aa
                jobId: 0192f0d5-0000-7000-8000-0000000000aa
                zoneStates:
                - zoneId: 0192f100-0000-7000-8000-0000000000f1
                  state: 방호벽 설치됨
                activeRisks: []
                staticObjects: []
        '404':
          description: 영상이 없거나(`ANALYSIS_SOURCE_NOT_FOUND`) 활성 분석 버전이 없음(`ANALYSIS_NO_ACTIVE_VERSION`)
          content:
            application/problem+json:
              schema:
                $ref: ./_common.yaml#/components/schemas/ProblemDetail
              example:
                type: about:blank
                title: Not Found
                status: 404
                code: ANALYSIS_NO_ACTIVE_VERSION
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/DeadlineExceeded'
  /api/v1/analysis/sources/{sourceId}/events:
    get:
      operationId: listSourceEvents
      summary: 영상의 이벤트 타임라인
      description: 활성 분석 버전의 이벤트. 정렬은 startMs, eventId 순. 기본은 병합 대표만이고 includeMerged=true면 합쳐진 이벤트도 준다 (SPEC-031 R-3)
      tags:
      - events
      parameters:
      - &id001
        $ref: ./_common.yaml#/components/parameters/XUserId
      - &id002
        $ref: ./_common.yaml#/components/parameters/XUserRoles
      - &id011
        $ref: '#/components/parameters/SourceId'
      - $ref: '#/components/parameters/EventTypeQ'
      - $ref: '#/components/parameters/SeverityQ'
      - $ref: '#/components/parameters/VerificationQ'
      - $ref: '#/components/parameters/ReviewStateQ'
      - name: includeMerged
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 이벤트 한 쪽
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - page
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventSummary'
                  page:
                    $ref: ./_common.yaml#/components/schemas/PageMeta
              example:
                items:
                - &id003
                  eventId: 0192f300-0000-5000-8000-000000000101
                  sourceId: 0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                  eventType: ppe_missing
                  startMs: 95000
                  endMs: 105000
                  seekMs: 93000
                  severity: medium
                  verificationStatus: confirmed
                  judgmentMethod: rule+vlm
                  description: 크레인 하부에서 작업자가 안전모 없이 자재를 옮깁니다.
                  zoneId: 0192f100-0000-7000-8000-0000000000f1
                  zoneName: A동 크레인 하부
                  trackId: 0192f200-0000-5000-8000-000000000001
                  reviewRequired: false
                  reviewState: UNREVIEWED
                  thumbnailUrl: https://storage.example/vlm/sources/...signed
                  mergedInto: null
                  origin: candidate
                page: &id004
                  page: 0
                  size: 20
                  totalElements: 1
                  totalPages: 1
        '400':
          $ref: '#/components/responses/PublicBadRequest'
        '404':
          $ref: '#/components/responses/PublicSourceNotFound'
        '401': &id005
          $ref: ./_common.yaml#/components/responses/Unauthenticated
  /api/v1/analysis/events:
    get:
      operationId: listMyEvents
      summary: 내 영상 전체의 이벤트
      description: 요청자 영상(OPERATOR는 전체)의 활성 분석 버전 이벤트. 정렬은 저장 시각 내림차순 (SPEC-031 R-11)
      tags:
      - events
      parameters:
      - *id001
      - *id002
      - $ref: '#/components/parameters/EventTypeQ'
      - $ref: '#/components/parameters/SeverityQ'
      - $ref: '#/components/parameters/VerificationQ'
      - $ref: '#/components/parameters/ReviewStateQ'
      - $ref: '#/components/parameters/FromQ'
      - $ref: '#/components/parameters/ToQ'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 이벤트 한 쪽
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - page
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventSummary'
                  page:
                    $ref: ./_common.yaml#/components/schemas/PageMeta
              example:
                items:
                - *id003
                page: *id004
        '400':
          $ref: '#/components/responses/PublicBadRequest'
        '401': *id005
  /api/v1/analysis/events/{eventId}:
    get:
      operationId: getEvent
      summary: 이벤트 상세
      description: 판정 결과, 근거 프레임 서명 주소, 판정 호출 요약, 확인 상태 (SPEC-031 R-5)
      tags:
      - events
      parameters:
      - *id001
      - *id002
      - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: 이벤트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
              example:
                event: *id003
                analysis: &id006
                  eventType: ppe_missing
                  eventDetected: true
                  verificationStatus: confirmed
                  description: 크레인 하부에서 작업자가 안전모 없이 자재를 옮깁니다.
                  beforeState: null
                  afterState: 안전모 미착용 작업자 작업 중
                  riskDetected: true
                  riskType: ppe_missing
                  riskReason: 안전모 미착용
                  solution: 안전관리자 확인 필요
                  severity: medium
                  evidenceStart: 95.0
                  evidenceEnd: 100.0
                evidenceFrames: &id007
                - ptsMs: 95000
                  url: https://storage.example/vlm/sources/...signed
                judgments: &id008
                - taskType: event_judge
                  modelId: gpt-6.1-terra
                  verificationStatus: confirmed
                  eventDetected: true
                reviewReasons: &id009 []
                detectorProfile: detect-v1
                versions: &id010
                  taxonomy: v2
                  analysis: 0192f0d5-0000-7000-8000-000000000001
                reviewNote: null
                reviewedBy: null
                reviewedAt: null
        '404':
          $ref: '#/components/responses/EventNotFound'
        '401': *id005
  /api/v1/analysis/events/{eventId}/review:
    put:
      operationId: reviewEvent
      summary: 이벤트 확인·기각 (운영자)
      description: OPERATOR만 쓴다. 확인 상태와 메모를 바꾸고 상세를 돌려준다 (SPEC-031 R-7)
      tags:
      - events
      parameters:
      - *id001
      - *id002
      - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewEventRequest'
            example:
              reviewState: DISMISSED
              note: 자재 그림자를 사람으로 봄
      responses:
        '200':
          description: 바뀐 이벤트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
              example:
                event:
                  eventId: 0192f300-0000-5000-8000-000000000101
                  sourceId: 0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                  eventType: ppe_missing
                  startMs: 95000
                  endMs: 105000
                  seekMs: 93000
                  severity: medium
                  verificationStatus: confirmed
                  judgmentMethod: rule+vlm
                  description: 크레인 하부에서 작업자가 안전모 없이 자재를 옮깁니다.
                  zoneId: 0192f100-0000-7000-8000-0000000000f1
                  zoneName: A동 크레인 하부
                  trackId: 0192f200-0000-5000-8000-000000000001
                  reviewRequired: false
                  reviewState: DISMISSED
                  thumbnailUrl: https://storage.example/vlm/sources/...signed
                  mergedInto: null
                  origin: candidate
                analysis: *id006
                evidenceFrames: *id007
                judgments: *id008
                reviewReasons: *id009
                detectorProfile: detect-v1
                versions: *id010
                reviewNote: 자재 그림자를 사람으로 봄
                reviewedBy: 0192f0c4-6d1e-7a3b-9c2d-1e2f3a4b5c6d
                reviewedAt: '2026-11-06T11:00:00Z'
        '400':
          $ref: '#/components/responses/PublicBadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '401': *id005
  /api/v1/analysis/sources/{sourceId}/risks:
    get:
      operationId: listSourceRisks
      summary: 영상의 위험 상태
      description: 활성 분석 버전의 위험 상태. 활성 먼저, 그다음 firstSeenMs 순 (SPEC-031 R-8)
      tags:
      - states
      parameters:
      - *id001
      - *id002
      - *id011
      responses:
        '200':
          description: 위험 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskList'
              example:
                jobId: 0192f0d5-0000-7000-8000-000000000001
                items:
                - riskId: 0192f500-0000-5000-8000-000000000004
                  zoneId: 0192f100-0000-7000-8000-0000000000f1
                  zoneName: A동 크레인 하부
                  riskType: ppe_missing
                  status: active
                  reason: 안전모 미착용
                  firstSeenMs: 100000
                  lastSeenMs: 100000
                  resolvedAtMs: null
                  relatedEventIds:
                  - 0192f300-0000-5000-8000-000000000101
                  carriedOver: false
                  exposure:
                    activeSeconds: 25.0
                    exposureCount: 1
                    exposureSeconds: 20.0
                  forecast: null
        '404':
          $ref: '#/components/responses/PublicSourceNotFound'
        '401': *id005
  /api/v1/analysis/sources/{sourceId}/snapshots:
    get:
      operationId: listSourceSnapshots
      summary: 영상의 상태 스냅샷
      description: timestampMs 순 (SPEC-031 R-9)
      tags:
      - states
      parameters:
      - *id001
      - *id002
      - *id011
      responses:
        '200':
          description: 스냅샷
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotList'
              example:
                jobId: 0192f0d5-0000-7000-8000-000000000001
                items:
                - snapshotId: 0192f500-0000-5000-8000-000000000003
                  zoneId: 0192f100-0000-7000-8000-0000000000f1
                  zoneName: A동 크레인 하부
                  timestampMs: 100000
                  previousState: 방호벽 설치됨
                  currentState: 안전모 미착용 작업자 작업 중
                  relatedEventId: 0192f300-0000-5000-8000-000000000101
        '404':
          $ref: '#/components/responses/PublicSourceNotFound'
        '401': *id005
  /api/v1/analysis/sources/{sourceId}/summary:
    get:
      operationId: getSourceSummary
      summary: 영상 분석 요약
      description: 요약문, 개수, 판정하지 않은 유형, 세션, 타임라인. 활성 분석 버전이 없으면 status NOT_ANALYZED이고 나머지는 비거나 null (SPEC-031 R-2)
      tags:
      - states
      parameters:
      - *id001
      - *id002
      - *id011
      responses:
        '200':
          description: 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceSummary'
              example:
                sourceId: 0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                status: READY
                jobId: 0192f0d5-0000-7000-8000-000000000001
                summary:
                  status: generated
                  text: A동 크레인 하부에서 안전모 미착용 작업자가 확인되었습니다.
                  highlights:
                  - atMs: 95000
                    text: 안전모 미착용
                counts:
                  events: 3
                  confirmedEvents: 2
                  activeRisks: 1
                  resolvedRisks: 0
                unsupportedEvents:
                  barrier_not_restored: 구역 정의 없음
                session: null
                timeline:
                - atMs: 95000
                  kind: event
                  refId: 0192f300-0000-5000-8000-000000000101
                  eventType: ppe_missing
                  zoneId: 0192f100-0000-7000-8000-0000000000f1
                  severity: medium
                analyzedAt: '2026-11-06T10:00:00Z'
        '404':
          $ref: '#/components/responses/PublicSourceNotFound'
        '401': *id005
components:
  parameters:
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: 앞 쪽의 nextCursor. 없으면 첫 쪽
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 500
    XCaller:
      name: X-Caller
      in: header
      required: true
      description: 호출하는 서비스 이름. 허용 호출자 목록(설정)에 있어야 한다
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{1,62}$
      example: aggregator
    XRequestDeadline:
      name: X-Request-Deadline
      in: header
      required: false
      description: '호출자가 결과를 기다리는 마감 시각(Unix epoch 밀리초). 남은 시간이 없으면 DB를 읽지 않고 504 `ANALYSIS_DEADLINE_EXCEEDED`다. 0 이상의 정수가 아니면 400 `ANALYSIS_INVALID_REQUEST`다.

        '
      schema:
        type: string
        pattern: ^[0-9]{1,16}$
      example: '1793947448160'
    TraceParent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context
      schema:
        type: string
        pattern: ^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
      example: 00-0123456789abcdef0123456789abcdef-0123456789abcdef-01
    EventId:
      name: eventId
      in: path
      required: true
      schema: &id012
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: 0부터 시작하는 페이지 번호
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: 페이지 크기
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    EventTypeQ:
      name: eventType
      in: query
      required: false
      schema: &id013
        $ref: ../taxonomy/v2/taxonomy.schema.json#/$defs/eventType
    SeverityQ:
      name: severity
      in: query
      required: false
      schema:
        type: string
        enum:
        - low
        - medium
        - high
    VerificationQ:
      name: verificationStatus
      in: query
      required: false
      schema:
        type: string
        enum:
        - confirmed
        - rejected
        - unverified
        - unknown
    ReviewStateQ:
      name: reviewState
      in: query
      required: false
      schema:
        type: string
        enum:
        - UNREVIEWED
        - CONFIRMED
        - DISMISSED
    FromQ:
      name: from
      in: query
      required: false
      description: 이벤트를 저장한 시각 하한(포함)
      schema:
        type: string
        format: date-time
    ToQ:
      name: to
      in: query
      required: false
      description: 상한(제외)
      schema:
        type: string
        format: date-time
  responses:
    BadRequest:
      description: 잘못된 커서·limit·헤더 (`ANALYSIS_INVALID_REQUEST`)
      content:
        application/problem+json:
          schema:
            $ref: ./_common.yaml#/components/schemas/ProblemDetail
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: ANALYSIS_INVALID_REQUEST
    JobNotFound:
      description: 영상이나 job이 없음 (`ANALYSIS_JOB_NOT_FOUND`)
      content:
        application/problem+json:
          schema:
            $ref: ./_common.yaml#/components/schemas/ProblemDetail
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: ANALYSIS_JOB_NOT_FOUND
    SourceNotFound:
      description: 영상이 없음 (`ANALYSIS_SOURCE_NOT_FOUND`)
      content:
        application/problem+json:
          schema:
            $ref: ./_common.yaml#/components/schemas/ProblemDetail
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: ANALYSIS_SOURCE_NOT_FOUND
    Unavailable:
      description: DB를 일시적으로 쓸 수 없음 (`ANALYSIS_UNAVAILABLE`). 다시 시도할 수 있다
      content:
        application/problem+json:
          schema:
            $ref: ./_common.yaml#/components/schemas/ProblemDetail
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            code: ANALYSIS_UNAVAILABLE
    DeadlineExceeded:
      description: '`X-Request-Deadline`까지 남은 시간이 없음 (`ANALYSIS_DEADLINE_EXCEEDED`)'
      content:
        application/problem+json:
          schema:
            $ref: ./_common.yaml#/components/schemas/ProblemDetail
          example:
            type: about:blank
            title: Gateway Timeout
            status: 504
            code: ANALYSIS_DEADLINE_EXCEEDED
    Forbidden:
      description: OPERATOR 역할이 필요함 (`ANALYSIS_FORBIDDEN`)
      content:
        application/problem+json:
          schema:
            $ref: ./_common.yaml#/components/schemas/ProblemDetail
          example:
            type: about:blank
            title: Forbidden
            status: 403
            code: ANALYSIS_FORBIDDEN
    EventNotFound:
      description: 이벤트가 없거나 남의 영상 (`ANALYSIS_EVENT_NOT_FOUND`)
      content:
        application/problem+json:
          schema:
            $ref: ./_common.yaml#/components/schemas/ProblemDetail
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: ANALYSIS_EVENT_NOT_FOUND
    PublicSourceNotFound:
      description: 영상이 없거나 남의 영상 (`ANALYSIS_SOURCE_NOT_FOUND`)
      content:
        application/problem+json:
          schema:
            $ref: ./_common.yaml#/components/schemas/ProblemDetail
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: ANALYSIS_SOURCE_NOT_FOUND
    PublicBadRequest:
      description: 요청 형식이 잘못됨 (`ANALYSIS_INVALID_REQUEST`)
      content:
        application/problem+json:
          schema:
            $ref: ./_common.yaml#/components/schemas/ProblemDetail
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: ANALYSIS_INVALID_REQUEST
  schemas:
    JobEvent:
      type: object
      additionalProperties: false
      required:
      - eventId
      - chunkId
      - eventType
      - startMs
      - endMs
      - trackId
      - zoneId
      - zoneName
      - judgmentMethod
      - score
      - reviewRequired
      - analysis
      properties:
        eventId:
          type: string
          format: uuid
        chunkId:
          type:
          - string
          - 'null'
          format: uuid
          description: 이벤트를 낸 청크. 청크 밖에서 만든 이벤트면 null
        eventType:
          $ref: ../taxonomy/v2/taxonomy.schema.json#/$defs/eventType
        startMs:
          type: integer
          minimum: 0
        endMs:
          type: integer
          minimum: 0
        trackId:
          type:
          - string
          - 'null'
          format: uuid
        zoneId:
          type:
          - string
          - 'null'
          format: uuid
        zoneName:
          type:
          - string
          - 'null'
          maxLength: 100
        judgmentMethod:
          type: string
          enum:
          - rule
          - rule+vlm
          - rule+vlm+escalate
          - vector+vlm
          - vector+vlm+escalate
        score:
          type:
          - number
          - 'null'
          minimum: -1
          maximum: 1
          description: 후보 점수(탐지기 후보는 detectorCandidate.score, 벡터 후보는 vectorCandidate.score)
        reviewRequired:
          type: boolean
        analysis:
          type: object
          description: 판정 결과 VLMAnalysis. 형식은 `events/_vlm-analysis.schema.json`이다(이 파일에서 직접 참조하지 않는 이유는 검사 도구가 그 스키마의 `$id` 기준 상대 참조를 풀지 못해서다)
    JobTrack:
      type: object
      additionalProperties: false
      required:
      - trackId
      - className
      - startMs
      - endMs
      properties:
        trackId:
          type: string
          format: uuid
        className:
          $ref: ../taxonomy/v2/taxonomy.schema.json#/$defs/className
        startMs:
          type: integer
          minimum: 0
        endMs:
          type: integer
          minimum: 0
    ZonePresence:
      type: object
      additionalProperties: false
      required:
      - trackId
      - zoneId
      - enterMs
      - exitMs
      properties:
        trackId:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        enterMs:
          type: integer
          minimum: 0
        exitMs:
          type: integer
          minimum: 0
          description: 영상 끝까지 나가지 않았으면 마지막 관측 시각
    Zone:
      type: object
      additionalProperties: false
      required:
      - zoneId
      - name
      - kind
      properties:
        zoneId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          type: string
          enum:
          - hazard
          - aisle
          - general
          description: hazard는 위험구역(체류·배회 규칙 대상), aisle은 통로
    FinalState:
      type: object
      additionalProperties: false
      required:
      - sourceId
      - jobId
      - zoneStates
      - activeRisks
      properties:
        sourceId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
          description: 활성 분석 버전의 job
        zoneStates:
          type: array
          items:
            $ref: ../aggregates/v1/source-result.schema.json#/properties/initialState/properties/zoneStates/items
        activeRisks:
          type: array
          items:
            $ref: ../aggregates/v1/source-result.schema.json#/properties/initialState/properties/activeRisks/items
        staticObjects:
          type: array
          description: 활성 분석 버전 끝의 정적 객체 재고(source.completed 결과 파일의 inventory). 저장된 재고가 없으면 빈 배열이다 (SPEC-028)
          items:
            $ref: ../aggregates/v1/source-result.schema.json#/properties/inventory/items
    SignedFrame:
      type: object
      additionalProperties: false
      required:
      - ptsMs
      - url
      properties:
        ptsMs:
          type:
          - integer
          - 'null'
          minimum: 0
        url:
          type: string
          format: uri
          description: 블러 사본의 서명 주소(1시간)
    EventSummary:
      type: object
      additionalProperties: false
      required:
      - eventId
      - sourceId
      - eventType
      - startMs
      - endMs
      - seekMs
      - severity
      - verificationStatus
      - judgmentMethod
      - description
      - zoneId
      - zoneName
      - trackId
      - reviewRequired
      - reviewState
      - thumbnailUrl
      - mergedInto
      - origin
      properties:
        eventId: *id012
        sourceId: *id012
        eventType: *id013
        startMs: &id014
          type: integer
          minimum: 0
        endMs: *id014
        seekMs:
          type: integer
          minimum: 0
          description: 플레이어 이동 시각. max(0, startMs − 2000)
        severity:
          type:
          - string
          - 'null'
          enum:
          - low
          - medium
          - high
          - null
        verificationStatus:
          type: string
          enum:
          - confirmed
          - rejected
          - unverified
          - unknown
        judgmentMethod:
          type: string
          maxLength: 50
          description: rule·rule+vlm·rule+vlm+escalate·vector+vlm·vector+vlm+escalate·inventory+state_compare
        description:
          type:
          - string
          - 'null'
          maxLength: 1000
        zoneId: &id015
          type: &id016
          - string
          - 'null'
          format: uuid
        zoneName:
          type:
          - string
          - 'null'
        trackId: *id015
        reviewRequired:
          type: boolean
        reviewState:
          type: string
          enum:
          - UNREVIEWED
          - CONFIRMED
          - DISMISSED
        thumbnailUrl:
          type:
          - string
          - 'null'
          format: uri
        mergedInto:
          type: *id016
          format: uuid
          description: 청크 경계 병합으로 다른 이벤트에 합쳐졌으면 대표 eventId. 목록 기본값은 대표만 보여 준다
        origin:
          type: string
          enum:
          - candidate
          - rule
          - inventory
          description: 'candidate: event.analyzed, rule: aggregator 시간 규칙, inventory: 재고 비교·장비 방치'
    EventDetail:
      type: object
      additionalProperties: false
      required:
      - event
      - analysis
      - evidenceFrames
      - judgments
      - reviewReasons
      - detectorProfile
      - versions
      - reviewNote
      - reviewedBy
      - reviewedAt
      properties:
        event:
          $ref: '#/components/schemas/EventSummary'
        analysis:
          type: object
          description: VLMAnalysis(`events/_vlm-analysis.schema.json`)
        evidenceFrames:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/SignedFrame'
        judgments:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - taskType
            - modelId
            - verificationStatus
            - eventDetected
            properties:
              taskType:
                type: string
              modelId:
                type:
                - string
                - 'null'
              verificationStatus:
                type: string
              eventDetected:
                type:
                - boolean
                - 'null'
        reviewReasons:
          type: array
          items:
            type: string
        detectorProfile:
          type:
          - string
          - 'null'
        versions:
          type: object
          additionalProperties:
            type: string
          description: detector·model·prompt·taxonomy·analysis 버전
        reviewNote:
          type:
          - string
          - 'null'
          maxLength: 500
        reviewedBy: *id015
        reviewedAt:
          type:
          - string
          - 'null'
          format: date-time
    ReviewEventRequest:
      type: object
      additionalProperties: false
      required:
      - reviewState
      properties:
        reviewState:
          type: string
          enum:
          - UNREVIEWED
          - CONFIRMED
          - DISMISSED
        note:
          type:
          - string
          - 'null'
          maxLength: 500
    Risk:
      type: object
      additionalProperties: false
      required:
      - riskId
      - zoneId
      - zoneName
      - riskType
      - status
      - reason
      - firstSeenMs
      - lastSeenMs
      - resolvedAtMs
      - relatedEventIds
      - carriedOver
      - exposure
      - forecast
      properties:
        riskId: *id012
        zoneId:
          type: string
          description: 구역 ID 또는 global
        zoneName:
          type:
          - string
          - 'null'
        riskType:
          type: string
        status:
          type: string
          enum:
          - active
          - resolved
        reason:
          type: string
        firstSeenMs: *id014
        lastSeenMs: *id014
        resolvedAtMs:
          type:
          - integer
          - 'null'
          minimum: 0
        relatedEventIds:
          type: array
          items: *id012
        carriedOver:
          type: boolean
        exposure:
          type: object
          additionalProperties: false
          required:
          - activeSeconds
          - exposureCount
          - exposureSeconds
          properties:
            activeSeconds:
              type: number
            exposureCount:
              type: integer
            exposureSeconds:
              type: number
        forecast:
          type:
          - object
          - 'null'
          description: SPEC-028 risk_forecast 결과(`events/_risk-forecast.schema.json`). 화면에는 참고용으로만 표시한다
    RiskList:
      type: object
      additionalProperties: false
      required:
      - jobId
      - items
      properties:
        jobId: *id015
        items:
          type: array
          items:
            $ref: '#/components/schemas/Risk'
    Snapshot:
      type: object
      additionalProperties: false
      required:
      - snapshotId
      - zoneId
      - zoneName
      - timestampMs
      - previousState
      - currentState
      - relatedEventId
      properties:
        snapshotId: *id012
        zoneId:
          type: string
        zoneName:
          type:
          - string
          - 'null'
        timestampMs: *id014
        previousState:
          type:
          - string
          - 'null'
        currentState:
          type:
          - string
          - 'null'
        relatedEventId: *id012
    SnapshotList:
      type: object
      additionalProperties: false
      required:
      - jobId
      - items
      properties:
        jobId: *id015
        items:
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'
    SourceSummary:
      type: object
      additionalProperties: false
      required:
      - sourceId
      - status
      - jobId
      - summary
      - counts
      - unsupportedEvents
      - session
      - timeline
      - analyzedAt
      properties:
        sourceId: *id012
        status:
          type: string
          enum:
          - NOT_ANALYZED
          - READY
          description: 활성 분석 버전이 있으면 READY. 진행 상태는 알림(job.status)으로 본다
        jobId:
          type: *id016
          format: uuid
          description: 활성 분석 버전의 job
        summary:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - status
          - text
          - highlights
          properties:
            status:
              type: string
              enum:
              - generated
              - not_configured
              - failed
              - empty
            text:
              type:
              - string
              - 'null'
            highlights:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - atMs
                - text
                properties:
                  atMs: *id014
                  text:
                    type: string
        counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: events·confirmedEvents·activeRisks·resolvedRisks 등
        unsupportedEvents:
          type: object
          additionalProperties:
            type: string
          description: 판정하지 않은 이벤트 유형과 이유. 화면에 "이 분석에서 판정하지 않은 이벤트"로 표시
        session:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - sessionId
          - role
          - previousSourceId
          - initialStateUsed
          properties:
            sessionId: *id012
            role:
              type: string
              enum:
              - BEFORE
              - DURING
              - AFTER
            previousSourceId: *id015
            initialStateUsed:
              type: boolean
        timeline:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - atMs
            - kind
            - refId
            - eventType
            - zoneId
            - severity
            properties:
              atMs: *id014
              kind:
                type: string
                enum:
                - event
                - rule_event
                - risk_activated
                - risk_resolved
                - inventory_event
              refId: *id012
              eventType:
                type:
                - string
                - 'null'
              zoneId:
                type:
                - string
                - 'null'
              severity:
                type:
                - string
                - 'null'
        analyzedAt:
          type:
          - string
          - 'null'
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- bearerAuth: []
