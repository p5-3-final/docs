openapi: 3.1.0
info:
  title: Common Schemas
  version: 1.2.0
  description: 모든 서비스가 $ref로 참조하는 공통 스키마, 게이트웨이 헤더, 공통 오류 응답
servers:
  - url: /
    description: 공통 컴포넌트 전용 파일 (경로 없음)
paths: {}
components:
  parameters:
    XUserId:
      name: X-User-Id
      in: header
      required: true
      description: |
        api-gateway가 검증한 접근 토큰의 `sub`. 클라이언트가 보낸 같은 이름의 헤더는 게이트웨이가 지운다. (SPEC-001 R-12, R-17)
      schema:
        type: string
        format: uuid
    XUserRoles:
      name: X-User-Roles
      in: header
      required: true
      description: api-gateway가 검증한 접근 토큰의 `roles`를 쉼표로 이은 값. 예 `USER,OPERATOR`
      schema:
        type: string
        example: USER
  responses:
    Unauthenticated:
      description: |
        api-gateway의 토큰 검증 실패. `AUTH_TOKEN_MISSING`, `AUTH_TOKEN_INVALID`, `AUTH_TOKEN_EXPIRED`,
        알림 연결은 `AUTH_TICKET_INVALID`. (SPEC-001 R-14~R-16, R-28)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: 접근 토큰이 만료되었습니다.
            code: AUTH_TOKEN_EXPIRED
    RateLimited:
      description: api-gateway의 요청 수 제한 초과 (GATEWAY_RATE_LIMITED, SPEC-001 R-30)
      headers:
        Retry-After:
          description: 다시 시도할 수 있을 때까지의 초
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            code: GATEWAY_RATE_LIMITED
    GatewayError:
      description: |
        api-gateway 자체 오류. 등록되지 않은 경로 404 `GATEWAY_ROUTE_NOT_FOUND`,
        하위 서비스 응답 시간 초과 504 `GATEWAY_TIMEOUT`, 연결 불가 503 `GATEWAY_UNAVAILABLE`. (SPEC-001 R-18~R-20)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Gateway Timeout
            status: 504
            code: GATEWAY_TIMEOUT
  schemas:
    Role:
      type: string
      enum: [USER, OPERATOR, ADMIN]
    ProblemDetail:
      type: object
      description: RFC 9457 오류 응답
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: 이미 가입된 이메일입니다.
        instance:
          type: string
          example: /api/v1/auth/signup
        code:
          type: string
          description: 서비스별 오류 코드 (<DOMAIN>_<REASON>)
          example: AUTH_EMAIL_DUPLICATED
        traceId:
          type: string
          description: 요청 추적 ID
        errors:
          type: array
          description: 요청 본문 검증 오류일 때 필드별 오류 목록. 그 밖의 오류에는 없다.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: 올바른 형식의 이메일 주소여야 합니다
    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
        totalPages:
          type: integer
