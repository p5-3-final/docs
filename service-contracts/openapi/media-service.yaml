openapi: 3.1.0
info:
  title: media-service API
  version: 1.3.1
  description: |
    영상 업로드 자리 발급, 업로드 완료 확인, 내 영상 목록·상세, 삭제 (SPEC-003), 원본 재생·내려받기 주소 발급 (SPEC-006),
    작업 세션 (SPEC-017), 학습용 보존 동의·보존 중인 삭제 영상·철회 (SPEC-018).
    외부 경로(`/api/v1/media/**`)는 api-gateway를 거쳐 호출한다.
    영상 파일 바이트는 media-service를 거치지 않고 응답으로 받은 주소로 저장소에 바로 올리고 바로 읽는다. (SPEC-003 NFR-1, SPEC-006 NFR-1)
    상태가 바뀔 때 발행하는 이벤트는 `../asyncapi/media-service.yaml`에 있다.
servers:
  - url: /
    description: api-gateway 기준 경로 (로컬 http://localhost:8080)
tags:
  - name: videos
    description: 영상 업로드와 관리
  - name: sessions
    description: 작업 세션. 영상 여러 개를 작업 하나(작업 전·중·후)로 묶는다. (SPEC-017)
  - name: retention
    description: 학습용 보존 동의, 보존 중인 삭제 영상과 철회 (SPEC-018, ADR-0011)
paths:
  /api/v1/media/videos:
    post:
      operationId: createVideo
      summary: 업로드 자리 발급
      description: |
        영상을 "업로드 중"(`UPLOADING`) 상태로 만들고 업로드 방법을 돌려준다.
        100MB(104,857,600바이트) 이하는 단일 업로드(`SINGLE`), 넘으면 멀티파트 업로드(`MULTIPART`)다.
        업로드 주소는 1시간 동안 유효하다. 24시간 안에 완료하지 않으면 영상은 만료된다.
        `sessionId`·`role`을 함께 보내면 영상을 요청자의 작업 세션에 넣는다. 세션과 역할은 이 요청에서만 정하고 나중에 바꾸지 않는다.
        `retentionConsent`를 보내지 않으면 계정 기본값(`GET /api/v1/media/retention-settings`)을 따른다.
        (SPEC-003 R-1~R-6, NFR-6, SPEC-017 R-6~R-10, SPEC-018 R-3·R-4)
      tags: [videos]
      parameters:
        - $ref: './_common.yaml#/components/parameters/XUserId'
        - $ref: './_common.yaml#/components/parameters/XUserRoles'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVideoRequest'
            example:
              fileName: parking-lot-0930.mp4
              sizeBytes: 52428800
              contentType: video/mp4
      responses:
        '201':
          description: 영상 생성, 업로드 방법
          headers:
            Location:
              description: 만든 영상의 상세 경로
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVideoResponse'
              examples:
                single:
                  summary: 100MB 이하 (단일 업로드)
                  value:
                    video:
                      id: 0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                      ownerId: 0192f0c4-6d1e-7a3b-9c2d-1e2f3a4b5c6d
                      fileName: parking-lot-0930.mp4
                      sizeBytes: 52428800
                      contentType: video/mp4
                      status: UPLOADING
                      createdAt: '2026-11-02T09:30:00Z'
                      uploadedAt: null
                      session: null
                      retentionConsent: false
                    upload:
                      method: SINGLE
                      url: https://vlm-media.s3.ap-northeast-2.amazonaws.com/
                      fields:
                        key: sources/0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f/original
                        Content-Type: video/mp4
                        policy: eyJleHBpcmF0aW9uIjoiMjAyNi0xMS0wMlQxMDozMDowMFoifQ==
                        x-amz-algorithm: AWS4-HMAC-SHA256
                        x-amz-credential: AKIAEXAMPLE/20261102/ap-northeast-2/s3/aws4_request
                        x-amz-date: 20261102T093000Z
                        x-amz-signature: 0123456789abcdef
                      expiresAt: '2026-11-02T10:30:00Z'
                multipart:
                  summary: 100MB 초과 (멀티파트 업로드)
                  value:
                    video:
                      id: 0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e10
                      ownerId: 0192f0c4-6d1e-7a3b-9c2d-1e2f3a4b5c6d
                      fileName: lobby-full-day.mov
                      sizeBytes: 209715200
                      contentType: video/quicktime
                      status: UPLOADING
                      createdAt: '2026-11-02T09:30:00Z'
                      uploadedAt: null
                      session: null
                      retentionConsent: false
                    upload:
                      method: MULTIPART
                      partSizeBytes: 67108864
                      parts:
                        - partNumber: 1
                          url: https://vlm-media.s3.ap-northeast-2.amazonaws.com/sources/0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e10/original?partNumber=1&uploadId=abc&X-Amz-Signature=0123
                        - partNumber: 2
                          url: https://vlm-media.s3.ap-northeast-2.amazonaws.com/sources/0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e10/original?partNumber=2&uploadId=abc&X-Amz-Signature=4567
                        - partNumber: 3
                          url: https://vlm-media.s3.ap-northeast-2.amazonaws.com/sources/0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e10/original?partNumber=3&uploadId=abc&X-Amz-Signature=89ab
                        - partNumber: 4
                          url: https://vlm-media.s3.ap-northeast-2.amazonaws.com/sources/0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e10/original?partNumber=4&uploadId=abc&X-Amz-Signature=cdef
                      expiresAt: '2026-11-02T10:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: './_common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: 세션에 "삭제"가 아닌 영상이 이미 100개 있음 (`MEDIA_SESSION_FULL`) (SPEC-017 R-10)
          content:
            application/problem+json:
              schema:
                $ref: './_common.yaml#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: 세션에는 영상을 100개까지 넣을 수 있습니다.
                code: MEDIA_SESSION_FULL
    get:
      operationId: listVideos
      summary: 내 영상 목록
      description: |
        요청자가 소유한 영상 중 "삭제" 상태가 아닌 것을 만든 시각 최신순으로 돌려준다. (SPEC-003 R-14)
      tags: [videos]
      parameters:
        - $ref: './_common.yaml#/components/parameters/XUserId'
        - $ref: './_common.yaml#/components/parameters/XUserRoles'
        - name: page
          in: query
          required: false
          description: 0부터 시작하는 페이지 번호
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: 페이지 크기
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 영상 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoPage'
              example:
                items:
                  - id: 0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                    ownerId: 0192f0c4-6d1e-7a3b-9c2d-1e2f3a4b5c6d
                    fileName: parking-lot-0930.mp4
                    sizeBytes: 52428800
                    contentType: video/mp4
                    status: UPLOADED
                    createdAt: '2026-11-02T09:30:00Z'
                    uploadedAt: '2026-11-02T09:31:12Z'
                    session: null
                    retentionConsent: false
                page:
                  page: 0
                  size: 20
                  totalElements: 1
                  totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: './_common.yaml#/components/responses/Unauthenticated'
  /api/v1/media/videos/{videoId}:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    get:
      operationId: getVideo
      summary: 영상 상세
      description: |
        소유자와 ADMIN만 볼 수 있다. 없는 영상, 삭제된 영상, 볼 권한이 없는 영상은 구분하지 않고 404다. (SPEC-003 R-15~R-17)
      tags: [videos]
      parameters:
        - $ref: './_common.yaml#/components/parameters/XUserId'
        - $ref: './_common.yaml#/components/parameters/XUserRoles'
      responses:
        '200':
          description: 영상 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
              example:
                id: 0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                ownerId: 0192f0c4-6d1e-7a3b-9c2d-1e2f3a4b5c6d
                fileName: parking-lot-0930.mp4
                sizeBytes: 52428800
                contentType: video/mp4
                status: UPLOADED
                createdAt: '2026-11-02T09:30:00Z'
                uploadedAt: '2026-11-02T09:31:12Z'
                session: null
                retentionConsent: false
        '401':
          $ref: './_common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/VideoNotFound'
    delete:
      operationId: deleteVideo
      summary: 영상 삭제
      description: |
        영상을 "삭제" 상태로 바꾸고 `video.deleted`를 발행한다. 저장소의 파일과 끝나지 않은 조각도 지운다.
        소유자와 ADMIN만 지울 수 있다. 이미 삭제된 영상은 404다. (SPEC-003 R-16~R-20)
      tags: [videos]
      parameters:
        - $ref: './_common.yaml#/components/parameters/XUserId'
        - $ref: './_common.yaml#/components/parameters/XUserRoles'
      responses:
        '204':
          description: 삭제됨
        '401':
          $ref: './_common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/VideoNotFound'
  /api/v1/media/videos/{videoId}/complete:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    post:
      operationId: completeVideoUpload
      summary: 업로드 완료
      description: |
        저장소에 신고한 크기의 파일이 있으면 "업로드 완료"(`UPLOADED`)로 바꾸고 `video.uploaded`를 발행한다.
        멀티파트 업로드면 `parts`에 모든 조각의 번호와 ETag를 담아 보낸다. 조각을 합친 뒤 같은 확인을 한다.
        이미 완료된 영상에 다시 요청하면 상태를 바꾸지 않고 현재 정보를 돌려준다(이벤트도 다시 발행하지 않는다).
        소유자만 요청할 수 있다. (SPEC-003 R-7~R-12)
      tags: [videos]
      parameters:
        - $ref: './_common.yaml#/components/parameters/XUserId'
        - $ref: './_common.yaml#/components/parameters/XUserRoles'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
            example:
              parts:
                - partNumber: 1
                  eTag: '"9b2cf535f27731c974343645a3985328"'
                - partNumber: 2
                  eTag: '"6f5902ac237024bdd0c176cb93063dc4"'
      responses:
        '200':
          description: 업로드 완료 (처음이거나 이미 완료됨)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
              example:
                id: 0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                ownerId: 0192f0c4-6d1e-7a3b-9c2d-1e2f3a4b5c6d
                fileName: parking-lot-0930.mp4
                sizeBytes: 52428800
                contentType: video/mp4
                status: UPLOADED
                createdAt: '2026-11-02T09:30:00Z'
                uploadedAt: '2026-11-02T09:31:12Z'
                session: null
                retentionConsent: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: './_common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '409':
          description: |
            저장소에 파일이 없거나 크기가 다름 (`MEDIA_UPLOAD_INCOMPLETE`, 상태는 그대로),
            만료되었거나 삭제 중인 영상 (`MEDIA_INVALID_STATE`)
          content:
            application/problem+json:
              schema:
                $ref: './_common.yaml#/components/schemas/ProblemDetail'
              examples:
                incomplete:
                  summary: 업로드가 끝나지 않음
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    detail: 업로드가 아직 끝나지 않았습니다.
                    code: MEDIA_UPLOAD_INCOMPLETE
                invalidState:
                  summary: 만료된 영상
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    detail: 만료된 영상은 업로드를 완료할 수 없습니다.
                    code: MEDIA_INVALID_STATE
  /api/v1/media/videos/{videoId}/playback:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    get:
      operationId: getVideoPlayback
      summary: 원본 재생·내려받기 주소 발급
      description: |
        업로드 완료 이후 상태(`UPLOADED`, `NORMALIZING`, `READY`, `REJECTED`)인 영상의 원본을 읽을 수 있는 서명 주소를 돌려준다.
        `url`은 업로드 때 신고한 형식(Content-Type)으로 응답하는 재생 주소이고, `downloadUrl`은 원래 파일 이름으로 내려받는 주소다.
        두 주소는 발급 시점부터 1시간 동안 유효하다. 만료되면 이 API를 다시 호출해 새 주소를 받는다.
        소유자와 ADMIN만 요청할 수 있다. (SPEC-006 R-1~R-5)
      tags: [videos]
      parameters:
        - $ref: './_common.yaml#/components/parameters/XUserId'
        - $ref: './_common.yaml#/components/parameters/XUserRoles'
      responses:
        '200':
          description: 재생·내려받기 주소
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoPlayback'
              example:
                url: https://vlm-media.s3.ap-northeast-2.amazonaws.com/sources/0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f/original?response-content-type=video%2Fmp4&X-Amz-Expires=3600&X-Amz-Signature=0123
                downloadUrl: https://vlm-media.s3.ap-northeast-2.amazonaws.com/sources/0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f/original?response-content-disposition=attachment&X-Amz-Expires=3600&X-Amz-Signature=4567
                expiresAt: '2026-11-02T10:30:00Z'
        '401':
          $ref: './_common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '409':
          description: 업로드가 끝나지 않았거나 만료된 영상 (`MEDIA_NOT_PLAYABLE`)
          content:
            application/problem+json:
              schema:
                $ref: './_common.yaml#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: 업로드가 끝난 영상만 재생할 수 있습니다.
                code: MEDIA_NOT_PLAYABLE
  /api/v1/media/videos/{videoId}/retention-consent:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    put:
      operationId: updateVideoRetentionConsent
      summary: 영상 보존 동의 바꾸기
      description: |
        "삭제"가 아닌 영상의 학습용 보존 동의를 바꾼다. 이벤트는 발행하지 않는다. 영상을 지울 때의 값이 적용된다.
        소유자만 바꿀 수 있다(ADMIN 포함 다른 사용자는 404). (SPEC-018 R-6·R-7)
      tags: [retention]
      parameters:
        - $ref: './_common.yaml#/components/parameters/XUserId'
        - $ref: './_common.yaml#/components/parameters/XUserRoles'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionConsentRequest'
            example:
              consent: true
      responses:
        '200':
          description: 바뀐 영상 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
              example:
                id: 0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                ownerId: 0192f0c4-6d1e-7a3b-9c2d-1e2f3a4b5c6d
                fileName: parking-lot-0930.mp4
                sizeBytes: 52428800
                contentType: video/mp4
                status: READY
                createdAt: '2026-11-02T09:30:00Z'
                uploadedAt: '2026-11-02T09:31:12Z'
                session: null
                retentionConsent: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: './_common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/VideoNotFound'
  /api/v1/media/sessions:
    post:
      operationId: createWorkSession
      summary: 작업 세션 만들기
      description: |
        요청자를 소유자로 하는 작업 세션을 만든다. 현장·구역은 표시용 문자열이다. (SPEC-017 R-1·R-2)
      tags: [sessions]
      parameters:
        - $ref: './_common.yaml#/components/parameters/XUserId'
        - $ref: './_common.yaml#/components/parameters/XUserRoles'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkSessionRequest'
            example:
              name: 3번 라인 방호벽 교체
              site: 평택 공장
              area: 3번 라인 프레스 앞
      responses:
        '201':
          description: 만든 세션
          headers:
            Location:
              description: 만든 세션의 상세 경로
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkSession'
              example:
                id: 0192f0e0-5a6b-7c8d-9e0f-1a2b3c4d5e6f
                ownerId: 0192f0c4-6d1e-7a3b-9c2d-1e2f3a4b5c6d
                name: 3번 라인 방호벽 교체
                site: 평택 공장
                area: 3번 라인 프레스 앞
                createdAt: '2026-11-06T09:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: './_common.yaml#/components/responses/Unauthenticated'
    get:
      operationId: listWorkSessions
      summary: 내 작업 세션 목록
      description: 요청자가 소유한 세션을 만든 시각 최신순으로 돌려준다. (SPEC-017 R-3)
      tags: [sessions]
      parameters:
        - $ref: './_common.yaml#/components/parameters/XUserId'
        - $ref: './_common.yaml#/components/parameters/XUserRoles'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 세션 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkSessionPage'
              example:
                items:
                  - id: 0192f0e0-5a6b-7c8d-9e0f-1a2b3c4d5e6f
                    ownerId: 0192f0c4-6d1e-7a3b-9c2d-1e2f3a4b5c6d
                    name: 3번 라인 방호벽 교체
                    site: 평택 공장
                    area: null
                    createdAt: '2026-11-06T09:00:00Z'
                page:
                  page: 0
                  size: 20
                  totalElements: 1
                  totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: './_common.yaml#/components/responses/Unauthenticated'
  /api/v1/media/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        description: 작업 세션 ID
        schema:
          type: string
          format: uuid
    get:
      operationId: getWorkSession
      summary: 작업 세션 상세
      description: |
        세션 정보와 세션에 속한 "삭제"가 아닌 영상을 돌려준다. 영상은 역할 순서(`BEFORE` → `DURING` → `AFTER`)로,
        같은 역할 안에서는 업로드 완료 시각 순으로, 업로드를 완료하지 않은 영상은 그 역할의 끝에 만든 시각 순으로 놓는다.
        소유자와 ADMIN만 볼 수 있다. 없는 세션과 볼 권한이 없는 세션은 구분하지 않고 404다. (SPEC-017 R-4·R-5·R-7)
      tags: [sessions]
      parameters:
        - $ref: './_common.yaml#/components/parameters/XUserId'
        - $ref: './_common.yaml#/components/parameters/XUserRoles'
      responses:
        '200':
          description: 세션과 속한 영상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkSessionDetail'
              example:
                id: 0192f0e0-5a6b-7c8d-9e0f-1a2b3c4d5e6f
                ownerId: 0192f0c4-6d1e-7a3b-9c2d-1e2f3a4b5c6d
                name: 3번 라인 방호벽 교체
                site: 평택 공장
                area: 3번 라인 프레스 앞
                createdAt: '2026-11-06T09:00:00Z'
                videos:
                  - id: 0192f0e1-0000-7000-8000-000000000001
                    ownerId: 0192f0c4-6d1e-7a3b-9c2d-1e2f3a4b5c6d
                    fileName: before.mp4
                    sizeBytes: 52428800
                    contentType: video/mp4
                    status: READY
                    createdAt: '2026-11-06T09:20:00Z'
                    uploadedAt: '2026-11-06T09:21:00Z'
                    session:
                      sessionId: 0192f0e0-5a6b-7c8d-9e0f-1a2b3c4d5e6f
                      role: BEFORE
                    retentionConsent: false
                  - id: 0192f0e1-0000-7000-8000-000000000002
                    ownerId: 0192f0c4-6d1e-7a3b-9c2d-1e2f3a4b5c6d
                    fileName: after.mp4
                    sizeBytes: 41943040
                    contentType: video/mp4
                    status: UPLOADED
                    createdAt: '2026-11-06T09:10:00Z'
                    uploadedAt: '2026-11-06T09:11:00Z'
                    session:
                      sessionId: 0192f0e0-5a6b-7c8d-9e0f-1a2b3c4d5e6f
                      role: AFTER
                    retentionConsent: false
        '401':
          $ref: './_common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/SessionNotFound'
  /api/v1/media/retention-settings:
    get:
      operationId: getRetentionSettings
      summary: 보존 설정 조회
      description: 요청자 계정의 학습용 보존 기본 동의 값. 바꾼 적이 없으면 `false`다. (SPEC-018 R-1)
      tags: [retention]
      parameters:
        - $ref: './_common.yaml#/components/parameters/XUserId'
        - $ref: './_common.yaml#/components/parameters/XUserRoles'
      responses:
        '200':
          description: 보존 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionSettings'
              example:
                defaultConsent: false
        '401':
          $ref: './_common.yaml#/components/responses/Unauthenticated'
    put:
      operationId: updateRetentionSettings
      summary: 보존 기본값 바꾸기
      description: 이후에 만드는 영상의 기본 동의 값을 바꾼다. 이미 있는 영상의 동의는 바꾸지 않는다. (SPEC-018 R-2)
      tags: [retention]
      parameters:
        - $ref: './_common.yaml#/components/parameters/XUserId'
        - $ref: './_common.yaml#/components/parameters/XUserRoles'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionSettings'
            example:
              defaultConsent: true
      responses:
        '200':
          description: 저장한 보존 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionSettings'
              example:
                defaultConsent: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: './_common.yaml#/components/responses/Unauthenticated'
  /api/v1/media/retained-videos:
    get:
      operationId: listRetainedVideos
      summary: 보존 중인 삭제 영상 목록
      description: |
        보존에 동의한 채 지운 영상 중 철회하지 않았고 보존 만료 시각이 지나지 않은 것을 삭제 시각 최신순으로 돌려준다.
        파일 이름은 남기지 않으므로 영상 ID와 시각만 있다(ADR-0011). (SPEC-018 R-13)
      tags: [retention]
      parameters:
        - $ref: './_common.yaml#/components/parameters/XUserId'
        - $ref: './_common.yaml#/components/parameters/XUserRoles'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 보존 중인 삭제 영상 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetainedVideoPage'
              example:
                items:
                  - videoId: 0192f0d2-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                    deletedAt: '2026-11-06T12:00:00Z'
                    retainUntil: '2027-11-06T12:00:00Z'
                page:
                  page: 0
                  size: 20
                  totalElements: 1
                  totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: './_common.yaml#/components/responses/Unauthenticated'
    delete:
      operationId: revokeAllRetainedVideos
      summary: 보존 동의 전체 철회
      description: |
        요청자의 보존 중인 삭제 영상마다 `video.retention.revoked`를 하나씩 발행하고 목록을 비운다. 목록이 비어 있어도 204다. (SPEC-018 R-16)
      tags: [retention]
      parameters:
        - $ref: './_common.yaml#/components/parameters/XUserId'
        - $ref: './_common.yaml#/components/parameters/XUserRoles'
      responses:
        '204':
          description: 모두 철회함
        '401':
          $ref: './_common.yaml#/components/responses/Unauthenticated'
  /api/v1/media/retained-videos/{videoId}:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    delete:
      operationId: revokeRetainedVideo
      summary: 보존 동의 철회
      description: |
        지운 영상의 보존 동의를 철회한다. `video.retention.revoked`를 발행하고 목록에서 뺀다.
        소유자만 요청할 수 있다. (SPEC-018 R-14·R-15)
      tags: [retention]
      parameters:
        - $ref: './_common.yaml#/components/parameters/XUserId'
        - $ref: './_common.yaml#/components/parameters/XUserRoles'
      responses:
        '204':
          description: 철회함
        '401':
          $ref: './_common.yaml#/components/responses/Unauthenticated'
        '404':
          description: 보존 중이 아니거나(동의하지 않음, 이미 철회, 만료) 소유자가 아님 (`MEDIA_RETAINED_VIDEO_NOT_FOUND`)
          content:
            application/problem+json:
              schema:
                $ref: './_common.yaml#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: 보존 중인 영상을 찾을 수 없습니다.
                code: MEDIA_RETAINED_VIDEO_NOT_FOUND
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: api-gateway가 검증한다. 하위 서비스는 XUserId, XUserRoles 헤더만 본다.
  parameters:
    VideoId:
      name: videoId
      in: path
      required: true
      description: 영상 ID (이벤트의 `sourceId`와 같다)
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: 0부터 시작하는 페이지 번호
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: 페이지 크기
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: |
        요청 형식 오류 (`MEDIA_INVALID_REQUEST`), 파일 크기가 0이거나 5GB 초과 (`MEDIA_FILE_SIZE_INVALID`),
        지원하지 않는 형식 (`MEDIA_UNSUPPORTED_FORMAT`)
      content:
        application/problem+json:
          schema:
            $ref: './_common.yaml#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: mp4, mov, mkv, avi 영상만 올릴 수 있습니다.
            code: MEDIA_UNSUPPORTED_FORMAT
    SessionNotFound:
      description: 없는 세션이거나 요청자가 볼(넣을) 권한이 없는 세션 (`MEDIA_SESSION_NOT_FOUND`)
      content:
        application/problem+json:
          schema:
            $ref: './_common.yaml#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: 작업 세션을 찾을 수 없습니다.
            code: MEDIA_SESSION_NOT_FOUND
    VideoNotFound:
      description: 없는 영상, 삭제된 영상, 볼 권한이 없는 영상 (`MEDIA_VIDEO_NOT_FOUND`)
      content:
        application/problem+json:
          schema:
            $ref: './_common.yaml#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: 영상을 찾을 수 없습니다.
            code: MEDIA_VIDEO_NOT_FOUND
  schemas:
    VideoContentType:
      type: string
      description: |
        영상 MIME 형식. 파일 이름의 확장자와 짝이 맞아야 한다:
        `video/mp4`(.mp4), `video/quicktime`(.mov), `video/x-matroska`(.mkv), `video/x-msvideo`(.avi). (SPEC-003 R-5)
      enum: [video/mp4, video/quicktime, video/x-matroska, video/x-msvideo]
    VideoStatus:
      type: string
      description: |
        영상 상태. `UPLOADING`(업로드 중), `UPLOADED`(업로드 완료, 정규화 대기), `NORMALIZING`(정규화 중),
        `READY`(정규화 완료, 분석 가능), `REJECTED`(분석할 수 없어 거절), `EXPIRED`(24시간 안에 완료하지 않음).
        삭제된 영상은 응답에 나오지 않는다. (SPEC-003, SPEC-007)
      enum: [UPLOADING, UPLOADED, NORMALIZING, READY, REJECTED, EXPIRED]
    CreateVideoRequest:
      type: object
      required: [fileName, sizeBytes, contentType]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: 원래 파일 이름. 표시용이며 저장 경로에는 쓰지 않는다. (SPEC-003 R-6)
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 5368709120
          description: 파일 크기(바이트). 최대 5GB
        contentType:
          $ref: '#/components/schemas/VideoContentType'
        sessionId:
          type: string
          format: uuid
          description: 넣을 작업 세션. 요청자가 소유한 세션이어야 하고 `role`과 함께 보낸다. (SPEC-017 R-6·R-8·R-9)
        role:
          description: 세션 안 역할. `sessionId`와 함께 보낸다. 하나만 보내면 400 `MEDIA_INVALID_REQUEST`다. (SPEC-017 R-8)
          allOf:
            - $ref: '#/components/schemas/SessionRole'
        retentionConsent:
          type: boolean
          description: 학습용 보존 동의. 보내지 않으면 계정 기본값을 따른다. (SPEC-018 R-3·R-4)
    CreateVideoResponse:
      type: object
      required: [video, upload]
      properties:
        video:
          $ref: '#/components/schemas/VideoResponse'
        upload:
          $ref: '#/components/schemas/UploadInstruction'
    UploadInstruction:
      description: |
        업로드 방법. `method`(`SINGLE`, `MULTIPART`)로 구분한다.
        `discriminator`는 쓰지 않는다. 계약 검증 도구(swagger-request-validator)가 OpenAPI 3.1의 discriminator를 처리하지 못한다.
      oneOf:
        - $ref: '#/components/schemas/SingleUpload'
        - $ref: '#/components/schemas/MultipartUpload'
    SingleUpload:
      type: object
      description: |
        브라우저 POST 업로드(multipart/form-data). `fields`를 모두 폼 필드로 넣고 마지막에 `file` 필드로 파일을 보낸다.
        저장소는 신고한 크기와 다른 파일을 거절한다. (SPEC-003 R-2)
      required: [method, url, fields, expiresAt]
      properties:
        method:
          type: string
          const: SINGLE
        url:
          type: string
          format: uri
        fields:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    MultipartUpload:
      type: object
      description: |
        조각마다 해당 `url`로 PUT 요청을 보내고, 응답의 `ETag` 헤더 값을 모아 업로드 완료 요청의 `parts`로 보낸다.
        마지막 조각을 뺀 모든 조각은 `partSizeBytes` 크기다. (SPEC-003 R-3, R-8)
      required: [method, partSizeBytes, parts, expiresAt]
      properties:
        method:
          type: string
          const: MULTIPART
        partSizeBytes:
          type: integer
          format: int64
        parts:
          type: array
          minItems: 1
          items:
            type: object
            required: [partNumber, url]
            properties:
              partNumber:
                type: integer
                minimum: 1
              url:
                type: string
                format: uri
        expiresAt:
          type: string
          format: date-time
    CompleteUploadRequest:
      type: object
      description: 단일 업로드면 본문이 없거나 `parts`를 생략한다. 멀티파트 업로드면 모든 조각을 번호순으로 보낸다.
      properties:
        parts:
          type: array
          minItems: 1
          items:
            type: object
            required: [partNumber, eTag]
            properties:
              partNumber:
                type: integer
                minimum: 1
              eTag:
                type: string
                minLength: 1
    VideoResponse:
      type: object
      required: [id, ownerId, fileName, sizeBytes, contentType, status, createdAt, uploadedAt, session, retentionConsent]
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        fileName:
          type: string
        sizeBytes:
          type: integer
          format: int64
        contentType:
          $ref: '#/components/schemas/VideoContentType'
        status:
          $ref: '#/components/schemas/VideoStatus'
        createdAt:
          type: string
          format: date-time
        uploadedAt:
          type: [string, 'null']
          format: date-time
          description: 업로드 완료 시각. 완료 전이면 null
        durationSec:
          type: [number, 'null']
          exclusiveMinimum: 0
          description: 정규화 사본 기준 영상 길이(초). `READY`가 아니면 null (SPEC-007 R-21)
          example: 612.48
        estimatedProcessingSec:
          type: [integer, 'null']
          minimum: 0
          description: 예상 분석 처리 시간(초). 영상 길이 × 처리 계수로 낸 추정치다. `READY`가 아니면 null (SPEC-007 R-20, R-21)
          example: 613
        session:
          type: [object, 'null']
          description: 속한 작업 세션과 역할. 세션이 없으면 null (SPEC-017 R-13)
          # rejectReason과 같은 이유로 oneOf 대신 type 배열로 쓴다(계약 검증 도구의 oneOf null 처리).
          required: [sessionId, role]
          properties:
            sessionId:
              type: string
              format: uuid
            role:
              $ref: '#/components/schemas/SessionRole'
        retentionConsent:
          type: boolean
          description: 학습용 보존 동의. 영상을 지울 때의 값으로 보존 여부를 정한다. (SPEC-018 R-5)
        rejectReason:
          type: [string, 'null']
          description: |
            정규화에서 거절한 사유. `REJECTED`가 아니면 null (SPEC-007 R-7~R-12, R-21).
            `UNREADABLE`(파일을 열 수 없음), `NO_VIDEO_STREAM`(영상 스트림 없음), `MISSING_METADATA`(길이·프레임률을 읽을 수 없음),
            `TOO_SHORT`(1초 미만), `TOO_LONG`(4시간 초과), `DECODE_FAILED`(디코딩 실패).
          # 다른 nullable 필드와 같은 형식으로 둔다. 계약 검증 도구(swagger-request-validator)가 oneOf 안의 type: 'null'을
          # 모든 값과 일치한다고 보아, oneOf로 쓰면 값이 있는 응답을 거절한다.
          enum: [UNREADABLE, NO_VIDEO_STREAM, MISSING_METADATA, TOO_SHORT, TOO_LONG, DECODE_FAILED, null]
    VideoPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VideoResponse'
        page:
          $ref: './_common.yaml#/components/schemas/PageMeta'
    VideoPlayback:
      type: object
      description: 원본 영상을 저장소에서 바로 읽는 서명 주소. 로그나 브라우저 저장소에 남기지 않는다. (SPEC-006 NFR-3)
      required: [url, downloadUrl, expiresAt]
      properties:
        url:
          type: string
          format: uri
          description: 재생 주소. 응답 형식은 업로드 때 신고한 영상 형식이다.
        downloadUrl:
          type: string
          format: uri
          description: 원래 파일 이름으로 내려받는 주소
        expiresAt:
          type: string
          format: date-time
          description: 두 주소의 만료 시각 (발급 시점 + 1시간)
    SessionRole:
      type: string
      description: 세션 안 역할. `BEFORE`(작업 전), `DURING`(작업 중), `AFTER`(작업 후). 이 순서가 세션 안 영상 순서다. (SPEC-017 R-7)
      enum: [BEFORE, DURING, AFTER]
    CreateWorkSessionRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        site:
          type: [string, 'null']
          maxLength: 100
          description: 현장 이름(표시용)
        area:
          type: [string, 'null']
          maxLength: 100
          description: 구역 이름(표시용). 분석의 구역 정의와 잇지 않는다.
    WorkSession:
      type: object
      required: [id, ownerId, name, site, area, createdAt]
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        name:
          type: string
        site:
          type: [string, 'null']
        area:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
    WorkSessionDetail:
      type: object
      # WorkSession과 같은 필드에 videos를 더한다. 계약 검증 도구(swagger-request-validator)가 allOf의 각 부분에
      # 추가 필드 금지를 적용해 allOf로 합치면 맞는 응답도 거절하므로 필드를 펼쳐 쓴다.
      required: [id, ownerId, name, site, area, createdAt, videos]
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        name:
          type: string
        site:
          type: [string, 'null']
        area:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        videos:
          type: array
          maxItems: 100
          description: 세션에 속한 "삭제"가 아닌 영상. 순서는 `getWorkSession` 설명을 따른다.
          items:
            $ref: '#/components/schemas/VideoResponse'
    WorkSessionPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkSession'
        page:
          $ref: './_common.yaml#/components/schemas/PageMeta'
    RetentionSettings:
      type: object
      required: [defaultConsent]
      properties:
        defaultConsent:
          type: boolean
          description: 새 영상의 학습용 보존 기본 동의 값
    RetentionConsentRequest:
      type: object
      required: [consent]
      properties:
        consent:
          type: boolean
    RetainedVideo:
      type: object
      description: 보존 중인 삭제 영상의 최소 기록. 파일 이름은 남기지 않는다(ADR-0011).
      required: [videoId, deletedAt, retainUntil]
      properties:
        videoId:
          type: string
          format: uuid
        deletedAt:
          type: string
          format: date-time
        retainUntil:
          type: string
          format: date-time
          description: 보존 만료 시각(삭제 시각에서 1년 뒤). 지나면 기록과 각 서비스의 보존 데이터가 지워진다.
    RetainedVideoPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RetainedVideo'
        page:
          $ref: './_common.yaml#/components/schemas/PageMeta'
security:
  - bearerAuth: []
