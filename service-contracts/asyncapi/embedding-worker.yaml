asyncapi: 3.0.0
info:
  title: embedding-worker events
  version: 1.0.0
  description: |
    embedding-worker 워커가 이벤트 설명문·트랙 속성·구간 주석을 텍스트 벡터로 바꿔 발행하는 이벤트 (SPEC-025).
    최소 한 번 전달이다. 같은 항목·같은 임베딩 모델이면 같은 eventId와 같은 파일 경로를 쓴다.
    payload의 원본은 `../events/*.schema.json`, 파일 형식은 `../vectors/v1/text-vector-file.schema.json`이다.
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: 로컬 compose의 Kafka
channels:
  eventAnalyzed:
    address: event.analyzed
    description: event-analyzer가 발행하는 판정 결과(소비 그룹 embedding-worker). 메시지 키는 sourceId다.
    messages:
      eventAnalyzed:
        $ref: '#/components/messages/EventAnalyzed'
  trackAnalyzed:
    address: track.analyzed
    description: track-analyzer가 발행하는 트랙 속성(소비 그룹 embedding-worker). 메시지 키는 sourceId다.
    messages:
      trackAnalyzed:
        $ref: '#/components/messages/TrackAnalyzed'
  segmentAnnotated:
    address: segment.annotated
    description: search-service가 발행하는 구간 주석(소비 그룹 embedding-worker). 메시지 키는 sourceId다.
    messages:
      segmentAnnotated:
        $ref: '#/components/messages/SegmentAnnotated'
  embeddingReady:
    address: embedding.ready
    description: 텍스트 항목 하나의 벡터 파일 경로. 메시지 키는 sourceId다.
    messages:
      embeddingReady:
        $ref: '#/components/messages/EmbeddingReady'
operations:
  consumeEventAnalyzed:
    action: receive
    summary: 설명문·위험 사유·조치 제안을 임베딩한다 (SPEC-025 R-1)
    channel:
      $ref: '#/channels/eventAnalyzed'
    messages:
      - $ref: '#/channels/eventAnalyzed/messages/eventAnalyzed'
  consumeTrackAnalyzed:
    action: receive
    summary: 트랙 속성 설명을 임베딩한다 (SPEC-025 R-2)
    channel:
      $ref: '#/channels/trackAnalyzed'
    messages:
      - $ref: '#/channels/trackAnalyzed/messages/trackAnalyzed'
  consumeSegmentAnnotated:
    action: receive
    summary: 구간 주석 문장을 임베딩한다 (SPEC-025 R-3)
    channel:
      $ref: '#/channels/segmentAnnotated'
    messages:
      - $ref: '#/channels/segmentAnnotated/messages/segmentAnnotated'
  publishEmbeddingReady:
    action: send
    summary: 항목마다 한 번 (SPEC-025 R-6)
    channel:
      $ref: '#/channels/embeddingReady'
    messages:
      - $ref: '#/channels/embeddingReady/messages/embeddingReady'
components:
  messages:
    EventAnalyzed:
      name: event.analyzed
      title: 이벤트 후보 판정 결과
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/event.analyzed.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    TrackAnalyzed:
      name: track.analyzed
      title: 트랙 속성·답변 결과
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/track.analyzed.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    SegmentAnnotated:
      name: segment.annotated
      title: 구간 주석
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/segment.annotated.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    EmbeddingReady:
      name: embedding.ready
      title: 텍스트 벡터 파일 저장 완료
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/embedding.ready.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
  schemas:
    KafkaHeaders:
      type: object
      properties:
        traceparent:
          type: string
          description: W3C Trace Context. 입력 메시지를 처리한 trace를 이어 간다(원칙 VI).
