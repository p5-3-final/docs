asyncapi: 3.0.0
info:
  title: search-service events
  version: 0.2.0
  description: |
    search-service가 발행하는 이벤트. 다른 담당자 서비스이고, 이 파일은 소비 쪽 spec이 아키텍처 문서대로 먼저 정한 채널만 담는다(생산자 담당자 확인 필요).
    - segment.annotated: 정밀 검색 구간 주석 (SPEC-025)
    - grounding.requested: 상위 구간 bbox 주석 요청 (SPEC-026)
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: 로컬 compose의 Kafka
channels:
  segmentAnnotated:
    address: segment.annotated
    description: 신뢰도 높은 재순위화 판정마다 한 건. 메시지 키는 sourceId다.
    messages:
      segmentAnnotated:
        $ref: '#/components/messages/SegmentAnnotated'
  groundingRequested:
    address: grounding.requested
    description: 검색 요청마다 한 건(상위 구간 최대 3개). 같은 groundingId의 클립이 이미 있으면 발행하지 않는다. 메시지 키는 sourceId다.
    messages:
      groundingRequested:
        $ref: '#/components/messages/GroundingRequested'
operations:
  publishSegmentAnnotated:
    action: send
    summary: 구간 주석 저장과 함께 발행 (SPEC-025)
    channel:
      $ref: '#/channels/segmentAnnotated'
    messages:
      - $ref: '#/channels/segmentAnnotated/messages/segmentAnnotated'
  publishGroundingRequested:
    action: send
    summary: 검색 결과 반환 뒤 발행 (SPEC-026)
    channel:
      $ref: '#/channels/groundingRequested'
    messages:
      - $ref: '#/channels/groundingRequested/messages/groundingRequested'
components:
  messages:
    GroundingRequested:
      name: grounding.requested
      title: bbox 주석 요청
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/grounding.requested.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    SegmentAnnotated:
      name: segment.annotated
      title: 구간 주석
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/segment.annotated.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
  schemas:
    KafkaHeaders:
      type: object
      properties:
        traceparent:
          type: string
          description: W3C Trace Context. 입력 메시지를 처리한 trace를 이어 간다(원칙 VI).
