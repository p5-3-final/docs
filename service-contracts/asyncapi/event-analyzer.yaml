asyncapi: 3.0.0
info:
  title: event-analyzer events
  version: 1.2.1
  description: |
    event-analyzer 워커가 이벤트 후보를 판정해 발행하는 이벤트 (SPEC-020 벡터 후보, SPEC-023 탐지기·규칙 후보).
    최소 한 번 전달이다. 같은 후보(candidateId)를 다시 처리하면 같은 eventId를 쓴다.
    메시지의 후보를 모두 판정한 뒤 후보마다 한 건씩 발행한다. 탐지기·규칙 후보 메시지(event.candidate)는 그 뒤 실행마다 event.manifest를 한 건 발행한다. 벡터 후보는 event.manifest 수에 넣지 않는다.
    payload의 원본은 `../events/*.schema.json`이고 판정 결과 형식은 `../events/_vlm-analysis.schema.json`이다.
    v5.1(ADR-0016): 실시간 긴급 후보 alert.candidate를 받아 alert.raised(pending → confirmed·dismissed)를 낸다. 이벤트는 저장하지 않는다(SPEC-023 R-21~R-23).
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: 로컬 compose의 Kafka
channels:
  eventCandidateVector:
    address: event.candidate.vector
    description: frame-encoder가 발행하는 입력(소비 그룹 event-analyzer). 메시지 키는 sourceId다.
    messages:
      eventCandidateVector:
        $ref: '#/components/messages/EventCandidateVector'
  eventCandidate:
    address: event.candidate
    description: chunk-processor가 발행하는 탐지기·규칙 후보 묶음(소비 그룹 event-analyzer). 메시지 키는 sourceId다.
    messages:
      eventCandidate:
        $ref: '#/components/messages/EventCandidate'
  alertCandidate:
    address: alert.candidate
    description: stream-ingestor가 발행하는 실시간 긴급 후보(소비 그룹 event-analyzer). 메시지 키는 sourceId다.
    messages:
      alertCandidate:
        $ref: '#/components/messages/AlertCandidate'
  alertRaised:
    address: alert.raised
    description: 긴급 알림. 후보마다 pending 1건과 confirmed 또는 dismissed 1건. 메시지 키는 sourceId다.
    messages:
      alertRaised:
        $ref: '#/components/messages/AlertRaised'
  eventManifest:
    address: event.manifest
    description: 실행 하나의 탐지기·규칙 후보 판정 완료. 메시지 키는 sourceId다.
    messages:
      eventManifest:
        $ref: '#/components/messages/EventManifest'
  eventAnalyzed:
    address: event.analyzed
    description: 후보 하나의 판정 결과. 메시지 키는 sourceId다.
    messages:
      eventAnalyzed:
        $ref: '#/components/messages/EventAnalyzed'
operations:
  consumeEventCandidateVector:
    action: receive
    summary: 벡터 후보를 event_judge로 판정하고 조건에 맞으면 재판정한다 (SPEC-020 R-1, R-3)
    channel:
      $ref: '#/channels/eventCandidateVector'
    messages:
      - $ref: '#/channels/eventCandidateVector/messages/eventCandidateVector'
  consumeEventCandidate:
    action: receive
    summary: 쿨다운 병합 뒤 규칙 후보는 템플릿으로 확정하고 VLM 후보는 판정한다 (SPEC-023 R-1~R-9)
    channel:
      $ref: '#/channels/eventCandidate'
    messages:
      - $ref: '#/channels/eventCandidate/messages/eventCandidate'
  consumeAlertCandidate:
    action: receive
    summary: pending 알림을 먼저 내고 event_judge로 confirmed·dismissed를 낸다 (SPEC-023 R-21~R-23)
    channel:
      $ref: '#/channels/alertCandidate'
    messages:
      - $ref: '#/channels/alertCandidate/messages/alertCandidate'
  publishAlertRaised:
    action: send
    summary: 긴급 후보마다 두 번(pending, 그 뒤 confirmed 또는 dismissed) (SPEC-023 R-21)
    channel:
      $ref: '#/channels/alertRaised'
    messages:
      - $ref: '#/channels/alertRaised/messages/alertRaised'
  publishEventManifest:
    action: send
    summary: 실행의 event.analyzed를 모두 발행한 뒤 한 번 (SPEC-023 R-10)
    channel:
      $ref: '#/channels/eventManifest'
    messages:
      - $ref: '#/channels/eventManifest/messages/eventManifest'
  publishEventAnalyzed:
    action: send
    summary: 후보마다 한 번 발행 (SPEC-020 R-8)
    channel:
      $ref: '#/channels/eventAnalyzed'
    messages:
      - $ref: '#/channels/eventAnalyzed/messages/eventAnalyzed'
components:
  messages:
    EventCandidateVector:
      name: event.candidate.vector
      title: 구간 벡터 프로토타입 후보
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/event.candidate.vector.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    EventCandidate:
      name: event.candidate
      title: 탐지기·규칙 이벤트 후보 묶음
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/event.candidate.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    AlertCandidate:
      name: alert.candidate
      title: 실시간 긴급 후보
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/alert.candidate.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    AlertRaised:
      name: alert.raised
      title: 긴급 알림
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/alert.raised.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    EventManifest:
      name: event.manifest
      title: 실행의 후보 판정 완료
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/event.manifest.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    EventAnalyzed:
      name: event.analyzed
      title: 이벤트 후보 판정 결과
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/event.analyzed.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
  schemas:
    KafkaHeaders:
      type: object
      properties:
        traceparent:
          type: string
          description: W3C Trace Context. 후보 메시지를 처리한 trace를 이어 간다(원칙 VI).
