asyncapi: 3.0.0
info:
  title: aggregator events
  version: 1.0.0
  description: |
    aggregator가 소비·발행하는 이벤트 (SPEC-027)
    - 소비: analysis.completed (소비 그룹 aggregator)
    - 발행: source.completed
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: 로컬 compose의 Kafka
channels:
  analysisCompleted:
    address: analysis.completed
    description: job마다 한 건. 메시지 키는 sourceId다.
    messages:
      analysisCompleted:
        $ref: '#/components/messages/AnalysisCompleted'
  sourceCompleted:
    address: source.completed
    description: job마다 한 건. 메시지 키는 sourceId다.
    messages:
      sourceCompleted:
        $ref: '#/components/messages/SourceCompleted'
operations:
  consumeAnalysisCompleted:
    action: receive
    summary: 영상 단위 집계 후 source.completed 발행 (SPEC-027)
    channel:
      $ref: '#/channels/analysisCompleted'
    messages:
      - $ref: '#/channels/analysisCompleted/messages/analysisCompleted'
  publishSourceCompleted:
    action: send
    summary: 결과 파일 저장 뒤 발행 (SPEC-027)
    channel:
      $ref: '#/channels/sourceCompleted'
    messages:
      - $ref: '#/channels/sourceCompleted/messages/sourceCompleted'
components:
  messages:
    AnalysisCompleted:
      name: analysis.completed
      title: 분석 적재 완료
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/analysis.completed.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    SourceCompleted:
      name: source.completed
      title: 영상 단위 집계 완료
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/source.completed.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
  schemas:
    KafkaHeaders:
      type: object
      properties:
        traceparent:
          type: string
          description: W3C Trace Context. 입력 메시지를 처리한 trace를 이어 간다(원칙 VI).
