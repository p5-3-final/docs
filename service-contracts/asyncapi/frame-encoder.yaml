asyncapi: 3.0.0
info:
  title: frame-encoder events
  version: 1.0.0
  description: |
    frame-encoder 워커가 segment.ready를 받아 발행하는 이벤트 (SPEC-019).
    최소 한 번 전달이다. 같은 실행(executionId)을 다시 처리하면 같은 eventId·같은 파일 경로를 쓴다.
    event.candidate.vector는 segment.embedded 뒤에, 후보가 있을 때만 발행한다.
    payload의 원본은 `../events/*.schema.json`, 벡터 파일 형식은 `../vectors/v1/vector-file.schema.json`이다.
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: 로컬 compose의 Kafka
channels:
  segmentReady:
    address: segment.ready
    description: chunk-processor가 발행하는 입력(소비 그룹 frame-encoder). 메시지 키는 sourceId다.
    messages:
      segmentReady:
        $ref: '#/components/messages/SegmentReady'
  segmentEmbedded:
    address: segment.embedded
    description: 구간·크롭 벡터 파일 저장 완료. 메시지 키는 sourceId다.
    messages:
      segmentEmbedded:
        $ref: '#/components/messages/SegmentEmbedded'
  eventCandidateVector:
    address: event.candidate.vector
    description: 구간 벡터 프로토타입 후보(ADR-0010 ③). 완료 판정에 넣지 않는다. 메시지 키는 sourceId다.
    messages:
      eventCandidateVector:
        $ref: '#/components/messages/EventCandidateVector'
operations:
  consumeSegmentReady:
    action: receive
    summary: 구간·크롭 블러 사본을 받아 벡터를 만든다 (SPEC-019 R-1, R-2)
    channel:
      $ref: '#/channels/segmentReady'
    messages:
      - $ref: '#/channels/segmentReady/messages/segmentReady'
  publishSegmentEmbedded:
    action: send
    summary: 벡터 파일을 저장한 뒤 발행 (SPEC-019 R-4)
    channel:
      $ref: '#/channels/segmentEmbedded'
    messages:
      - $ref: '#/channels/segmentEmbedded/messages/segmentEmbedded'
  publishEventCandidateVector:
    action: send
    summary: 임계값을 넘는 구간·유형이 있으면 실행마다 한 번 발행 (SPEC-019 R-12)
    channel:
      $ref: '#/channels/eventCandidateVector'
    messages:
      - $ref: '#/channels/eventCandidateVector/messages/eventCandidateVector'
components:
  messages:
    SegmentReady:
      name: segment.ready
      title: 구간 입력 준비
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/segment.ready.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    SegmentEmbedded:
      name: segment.embedded
      title: 구간·크롭 벡터 저장 완료
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/segment.embedded.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    EventCandidateVector:
      name: event.candidate.vector
      title: 구간 벡터 프로토타입 후보
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/event.candidate.vector.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
  schemas:
    KafkaHeaders:
      type: object
      properties:
        traceparent:
          type: string
          description: W3C Trace Context. 요청을 처리한 trace를 이어 간다(원칙 VI).
