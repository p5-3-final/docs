asyncapi: 3.0.0
info:
  title: track-analyzer events
  version: 1.0.0
  description: |
    track-analyzer 워커가 트랙 속성 분석·객체 자유 질문 요청을 처리해 발행하는 이벤트 (SPEC-024).
    최소 한 번 전달이다. 같은 requestId를 다시 처리하면 같은 eventId를 쓴다. 실패도 outcome FAILED로 발행한다.
    payload의 원본은 `../events/*.schema.json`, 결과 형식은 `../events/_track-attribute.schema.json`·`_object-answer.schema.json`이다.
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: 로컬 compose의 Kafka
channels:
  attributeRequested:
    address: attribute.requested
    description: analysis-api가 발행하는 요청(소비 그룹 track-analyzer). 메시지 키는 sourceId다.
    messages:
      attributeRequested:
        $ref: '#/components/messages/AttributeRequested'
  trackAnalyzed:
    address: track.analyzed
    description: 요청 하나의 처리 결과. 메시지 키는 sourceId다.
    messages:
      trackAnalyzed:
        $ref: '#/components/messages/TrackAnalyzed'
operations:
  consumeAttributeRequested:
    action: receive
    summary: reason에 따라 track_attribute 또는 object_question을 부른다 (SPEC-024 R-1~R-4)
    channel:
      $ref: '#/channels/attributeRequested'
    messages:
      - $ref: '#/channels/attributeRequested/messages/attributeRequested'
  publishTrackAnalyzed:
    action: send
    summary: 요청마다 한 번 (SPEC-024 R-5)
    channel:
      $ref: '#/channels/trackAnalyzed'
    messages:
      - $ref: '#/channels/trackAnalyzed/messages/trackAnalyzed'
components:
  messages:
    AttributeRequested:
      name: attribute.requested
      title: 트랙 속성·자유 질문 요청
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/attribute.requested.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    TrackAnalyzed:
      name: track.analyzed
      title: 트랙 속성·답변 결과
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/track.analyzed.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
  schemas:
    KafkaHeaders:
      type: object
      properties:
        traceparent:
          type: string
          description: W3C Trace Context. 요청을 처리한 trace를 이어 간다(원칙 VI).
