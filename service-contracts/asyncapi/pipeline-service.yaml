asyncapi: 3.0.0
info:
  title: Pipeline dispatch events
  version: 1.0.0
  description: |
    SPEC-010 신규 backend 계약. 실제 chunk-processor 연결은 후속이다.
    최소 한 번 전달. eventId·executionId·requestId·입력은 재발행 시 유지한다.
    requestId=executionId. startBefore 이후 신규 시작을 거부한다. 만료만으로 실행 종료를 가정하지 않는다.
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
channels:
  chunkRequested:
    address: chunk.requested
    messages:
      chunkRequested:
        $ref: '#/components/messages/ChunkRequested'
operations:
  publishChunkRequested:
    action: send
    summary: 실행·슬롯·청크 상태와 같은 트랜잭션에 저장한 요청 발행
    channel:
      $ref: '#/channels/chunkRequested'
    messages:
      - $ref: '#/channels/chunkRequested/messages/chunkRequested'
components:
  messages:
    ChunkRequested:
      name: chunk.requested
      title: 청크 처리 요청
      headers:
        type: object
        properties:
          traceparent:
            type: string
            description: W3C Trace Context
      payload:
        $ref: '../events/chunk.requested.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
