asyncapi: 3.0.0
info:
  title: Pipeline dispatch and status events
  version: 1.0.0
  description: SPEC-015. 실행 집계와 분석 상태를 구분한 스냅샷을 발행한다.
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
channels:
  requested:
    address: chunk.requested
    messages:
      requested:
        payload:
          $ref: '../events/chunk.requested.schema.json'
        headers:
          $ref: '#/components/schemas/Headers'
        bindings:
          kafka:
            key:
              type: string
              format: uuid
              description: sourceId
  status:
    address: job.status
    messages:
      status:
        payload:
          $ref: '../events/job.status.schema.json'
        headers:
          $ref: '#/components/schemas/Headers'
        bindings:
          kafka:
            key:
              type: string
              format: uuid
              description: sourceId
operations:
  publishRequested:
    action: send
    channel:
      $ref: '#/channels/requested'
  publishStatus:
    action: send
    channel:
      $ref: '#/channels/status'
components:
  schemas:
    Headers:
      type: object
      properties:
        traceparent:
          type: string
          description: W3C Trace Context
