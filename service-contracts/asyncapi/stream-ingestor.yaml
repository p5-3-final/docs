asyncapi: 3.0.0
info:
  title: stream-ingestor events
  version: 1.0.0
  description: |
    stream-ingestor 워커가 카메라 스트림을 창(기본 20초)마다 chunk-processor와 같은 출력 계약으로 발행하는 이벤트 (SPEC-037, ADR-0015).
    - 소비: stream.command (소비 그룹 stream-ingestor)
    - 발행: segment.ready, event.candidate, track.detected, chunk.boundary, chunk.manifest(모두 jobType STREAM), alert.candidate
    최소 한 번 전달이다. chunkId = uuid5(sourceId, 창 순번), executionId는 창마다 새로 발급한다. chunk.execution.finished는 내지 않는다(pipeline-service 전용).
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: 로컬 compose의 Kafka
channels:
  streamCommand:
    address: stream.command
    description: stream-service가 발행하는 세션 시작 명령(소비 그룹 stream-ingestor). 임대를 잡은 Pod만 처리하고, 용량이 차면 재시도 토픽으로 되돌린다.
    messages:
      streamCommand:
        $ref: '#/components/messages/StreamCommand'
  segmentReady:
    address: segment.ready
    description: 창마다 한 건. chunk-processor와 같은 형식, jobType STREAM. 메시지 키는 sourceId다.
    messages:
      segmentReady:
        $ref: '#/components/messages/SegmentReady'
  eventCandidate:
    address: event.candidate
    description: 창마다 한 건(0건 포함). jobType STREAM.
    messages:
      eventCandidate:
        $ref: '#/components/messages/EventCandidate'
  trackDetected:
    address: track.detected
    description: 창마다 한 건(origin chunk, 세션 trackId, trackIdEpoch). jobType STREAM.
    messages:
      trackDetected:
        $ref: '#/components/messages/TrackDetected'
  chunkBoundary:
    address: chunk.boundary
    description: 창마다 한 건. track-stitcher는 jobType STREAM이면 건너뛴다.
    messages:
      chunkBoundary:
        $ref: '#/components/messages/ChunkBoundary'
  chunkManifest:
    address: chunk.manifest
    description: 창마다 마지막에 한 건. trackIdEpoch·last·gapMs를 싣는다.
    messages:
      chunkManifest:
        $ref: '#/components/messages/ChunkManifest'
  alertCandidate:
    address: alert.candidate
    description: 긴급 후보마다 창 종료 전에 한 건.
    messages:
      alertCandidate:
        $ref: '#/components/messages/AlertCandidate'
operations:
  consumeStreamCommand:
    action: receive
    summary: 임대를 잡고 RTSP 수신을 시작한다 (SPEC-037 R-1, R-2)
    channel:
      $ref: '#/channels/streamCommand'
    messages:
      - $ref: '#/channels/streamCommand/messages/streamCommand'
  publishSegmentReady:
    action: send
    summary: 창마다 한 번 (SPEC-037 R-6, R-7)
    channel:
      $ref: '#/channels/segmentReady'
    messages:
      - $ref: '#/channels/segmentReady/messages/segmentReady'
  publishEventCandidate:
    action: send
    summary: 창마다 한 번 (SPEC-037 R-7, R-13)
    channel:
      $ref: '#/channels/eventCandidate'
    messages:
      - $ref: '#/channels/eventCandidate/messages/eventCandidate'
  publishTrackDetected:
    action: send
    summary: 창마다 한 번 (SPEC-037 R-7, R-8)
    channel:
      $ref: '#/channels/trackDetected'
    messages:
      - $ref: '#/channels/trackDetected/messages/trackDetected'
  publishChunkBoundary:
    action: send
    summary: 창마다 한 번 (SPEC-037 R-7)
    channel:
      $ref: '#/channels/chunkBoundary'
    messages:
      - $ref: '#/channels/chunkBoundary/messages/chunkBoundary'
  publishChunkManifest:
    action: send
    summary: 창마다 마지막에 한 번 (SPEC-037 R-10, R-14)
    channel:
      $ref: '#/channels/chunkManifest'
    messages:
      - $ref: '#/channels/chunkManifest/messages/chunkManifest'
  publishAlertCandidate:
    action: send
    summary: 긴급 후보마다 즉시 (SPEC-037 R-11, R-12)
    channel:
      $ref: '#/channels/alertCandidate'
    messages:
      - $ref: '#/channels/alertCandidate/messages/alertCandidate'
components:
  messages:
    StreamCommand:
      name: stream.command
      title: 수집 세션 시작 명령
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/stream.command.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    SegmentReady:
      name: segment.ready
      title: 구간 프레임 준비
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/segment.ready.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    EventCandidate:
      name: event.candidate
      title: 탐지기·규칙 이벤트 후보 묶음
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/event.candidate.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    TrackDetected:
      name: track.detected
      title: 창 트랙 요약
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/track.detected.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    ChunkBoundary:
      name: chunk.boundary
      title: 창 경계 트랙 요약
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/chunk.boundary.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    ChunkManifest:
      name: chunk.manifest
      title: 창 산출물 목록
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/chunk.manifest.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    AlertCandidate:
      name: alert.candidate
      title: 실시간 긴급 후보
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/alert.candidate.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
  schemas:
    KafkaHeaders:
      type: object
      properties:
        traceparent:
          type: string
          description: W3C Trace Context. 입력 메시지를 처리한 trace를 이어 간다(원칙 VI).
