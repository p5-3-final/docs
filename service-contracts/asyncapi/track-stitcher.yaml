asyncapi: 3.0.0
info:
  title: track-stitcher events
  version: 1.0.0
  description: |
    track-stitcher 워커가 청크 경계 트랙을 잇고 재등장 트랙을 다시 연결해(Re-ID) 발행하는 이벤트 (SPEC-022).
    최소 한 번 전달이다. 같은 청크 쌍·같은 Job이면 같은 eventId를 쓴다.
    인접 청크 한 쌍을 이을 때마다 track.detected(origin stitcher)를, Job의 연결이 끝나면 track.manifest를 한 번 발행한다.
    payload의 원본은 `../events/*.schema.json`, 파일 형식은 `../tracks/v1/`이다.
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: 로컬 compose의 Kafka
channels:
  chunkBoundary:
    address: chunk.boundary
    description: chunk-processor가 실행마다 발행하는 트랙 요약(소비 그룹 track-stitcher). 메시지 키는 sourceId다.
    messages:
      chunkBoundary:
        $ref: '#/components/messages/ChunkBoundary'
  segmentEmbedded:
    address: segment.embedded
    description: frame-encoder가 발행하는 벡터 파일 저장 완료(소비 그룹 track-stitcher). 크롭 벡터를 Re-ID에 쓴다. 메시지 키는 sourceId다.
    messages:
      segmentEmbedded:
        $ref: '#/components/messages/SegmentEmbedded'
  videoDeleted:
    address: video.deleted
    description: media-service가 발행하는 영상 삭제(소비 그룹 track-stitcher). 그 영상의 대기 상태를 지운다.
    messages:
      videoDeleted:
        $ref: '#/components/messages/VideoDeleted'
  trackDetected:
    address: track.detected
    description: 인접 청크 한 쌍의 경계 연결 결과(origin stitcher). 메시지 키는 sourceId다.
    messages:
      trackDetected:
        $ref: '#/components/messages/TrackDetected'
  trackManifest:
    address: track.manifest
    description: Job의 트랙 연결 완료와 번역표 경로. 메시지 키는 sourceId다.
    messages:
      trackManifest:
        $ref: '#/components/messages/TrackManifest'
operations:
  consumeChunkBoundary:
    action: receive
    summary: 청크 트랙 요약을 모으고 인접 청크가 있으면 경계 트랙을 잇는다 (SPEC-022 R-1~R-6)
    channel:
      $ref: '#/channels/chunkBoundary'
    messages:
      - $ref: '#/channels/chunkBoundary/messages/chunkBoundary'
  consumeSegmentEmbedded:
    action: receive
    summary: 실행의 크롭 벡터 파일 경로를 모은다 (SPEC-022 R-7)
    channel:
      $ref: '#/channels/segmentEmbedded'
    messages:
      - $ref: '#/channels/segmentEmbedded/messages/segmentEmbedded'
  consumeVideoDeleted:
    action: receive
    summary: 영상의 대기 상태를 지운다 (SPEC-022 R-19)
    channel:
      $ref: '#/channels/videoDeleted'
    messages:
      - $ref: '#/channels/videoDeleted/messages/videoDeleted'
  publishTrackDetected:
    action: send
    summary: 인접 청크 한 쌍을 이을 때마다 한 번 (SPEC-022 R-5)
    channel:
      $ref: '#/channels/trackDetected'
    messages:
      - $ref: '#/channels/trackDetected/messages/trackDetected'
  publishTrackManifest:
    action: send
    summary: Job마다 한 번 (SPEC-022 R-12)
    channel:
      $ref: '#/channels/trackManifest'
    messages:
      - $ref: '#/channels/trackManifest/messages/trackManifest'
components:
  messages:
    ChunkBoundary:
      name: chunk.boundary
      title: 청크 트랙 요약
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/chunk.boundary.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    SegmentEmbedded:
      name: segment.embedded
      title: 구간·크롭 벡터 파일 저장 완료
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/segment.embedded.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    VideoDeleted:
      name: video.deleted
      title: 영상 삭제
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/video.deleted.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    TrackDetected:
      name: track.detected
      title: 경계 연결 결과
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/track.detected.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
    TrackManifest:
      name: track.manifest
      title: Job 트랙 연결 완료
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '../events/track.manifest.schema.json'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: sourceId
  schemas:
    KafkaHeaders:
      type: object
      properties:
        traceparent:
          type: string
          description: W3C Trace Context. 입력 메시지를 처리한 trace를 이어 간다(원칙 VI).
